name: Direct Relay GPT-5.6 effort pilot

on:
  workflow_dispatch:
    inputs:
      case_scope:
        description: Run only the six unfinished cases; the completed original four are reused offline
        required: true
        type: choice
        default: new-six
        options:
          - new-six
      confirm_paid_run:
        description: Confirm direct paid Relay calls
        required: true
        type: boolean
        default: false
      effort_range:
        description: Reasoning efforts
        required: true
        type: choice
        default: low-only
        options:
          - none-only
          - low-only
          - medium-only
          - high-only
          - xhigh-only
          - max-only
      max_calls:
        description: Hard maximum paid calls (selected cases x selected efforts)
        required: true
        type: choice
        default: "6"
        options:
          - "6"
      resume_run_id:
        description: Optional prior workflow run ID whose artifact should be resumed
        required: false
        type: string
        default: ""
      resume_artifact_name:
        description: Optional exact artifact name for the prior checkpoint (defaults to this model/run)
        required: false
        type: string
        default: ""
      source_run_id:
        description: Optional canonical workflow run ID supplying the frozen Evidence Snapshot bundle
        required: false
        type: string
        default: ""
      source_artifact_name:
        description: Exact canonical source artifact name (required with source_run_id)
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: direct-relay-gpt-5.6-sol-${{ inputs.case_scope }}-${{ inputs.effort_range }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Require explicit paid-run confirmation
        shell: bash
        env:
          CONFIRM_PAID_RUN: ${{ inputs.confirm_paid_run }}
        run: |
          set -euo pipefail
          test "$CONFIRM_PAID_RUN" = "true" || { echo "Paid run was not confirmed" >&2; exit 1; }

      - name: Prepare artifact directory
        shell: bash
        run: mkdir -p artifacts/source artifacts/resume

      - name: Require an explicit canonical source artifact name
        if: ${{ inputs.source_run_id != '' }}
        shell: bash
        env:
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_ARTIFACT_NAME" || {
            echo "source_artifact_name is required when source_run_id is set" >&2
            exit 1
          }

      - name: Download canonical frozen source bundle
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download prior checkpoint for fail-closed resume
        if: ${{ inputs.resume_run_id != '' && inputs.resume_artifact_name == '' }}
        uses: actions/download-artifact@v4
        with:
          name: direct-relay-relay-gpt-5.6-sol-${{ inputs.resume_run_id }}
          path: artifacts/resume
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Download explicitly named prior checkpoint for fail-closed resume
        if: ${{ inputs.resume_run_id != '' && inputs.resume_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.resume_artifact_name }}
          path: artifacts/resume
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Normalize canonical source and resume checkpoint paths
        shell: bash
        run: |
          set -euo pipefail
          copy_unique() {
            local directory="$1"
            local pattern="$2"
            local destination="$3"
            mapfile -t matches < <(find "$directory" -type f -name "$pattern" -print)
            if [ "${#matches[@]}" -gt 1 ]; then
              echo "Expected at most one $pattern in $directory, found ${#matches[@]}" >&2
              exit 1
            fi
            if [ "${#matches[@]}" -eq 1 ]; then
              cp "${matches[0]}" "$destination"
            fi
          }
          copy_unique artifacts/source '*source-bundle.json' artifacts/direct-relay-source-bundle.json
          copy_unique artifacts/resume '*result-checkpoint.json' artifacts/direct-relay-result-checkpoint.json

      - name: Build frozen source bundle without Admin API or model transport
        shell: bash
        env:
          CASE_SCOPE: ${{ inputs.case_scope }}
        run: |
          set -euo pipefail
          if [ ! -s artifacts/direct-relay-source-bundle.json ]; then
            case "$CASE_SCOPE" in
              four) cases_file=tests/fixtures/admin-evidence-dry-run-cases.json ;;
              new-six|ten) cases_file=tests/fixtures/model-effort-ten-case-cases.json ;;
              *) echo "Unsupported case scope" >&2; exit 1 ;;
            esac
            node scripts/admin-evidence-snapshot-dry-run.mjs \
              --cases "$cases_file" \
              --compact \
              --bundle-output artifacts/direct-relay-source-bundle.json \
              > /dev/null
          fi

      - name: Run direct Relay matrix sequentially
        shell: bash
        env:
          RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
          RELAY_BASE_URL: https://api.986310.xyz/v1
          RELAY_MODEL: relay-gpt-5.6-sol
          CASE_SCOPE: ${{ inputs.case_scope }}
          EFFORT_RANGE: ${{ inputs.effort_range }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: |
          set -euo pipefail
          test -n "$RELAY_API_KEY" || { echo "RELAY_API_KEY secret is not configured" >&2; exit 1; }
          case "$EFFORT_RANGE" in
            none-only) efforts=(none) ;;
            low-only) efforts=(low) ;;
            medium-only) efforts=(medium) ;;
            high-only) efforts=(high) ;;
            xhigh-only) efforts=(xhigh) ;;
            max-only) efforts=(max) ;;
            low-medium) efforts=(low medium) ;;
            none-low-medium) efforts=(none low medium) ;;
            none-low-medium-high) efforts=(none low medium high) ;;
            all-six) efforts=(none low medium high xhigh max) ;;
            *) echo "Unsupported effort range" >&2; exit 1 ;;
          esac
          bundle_case_ids=$(node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const bundle = JSON.parse(await readFile("artifacts/direct-relay-source-bundle.json", "utf8"));
            if (!Array.isArray(bundle.sources)) throw new Error("source bundle has no sources array");
            const ids = bundle.sources.map((item) => String(item?.caseId || ""));
            if (ids.some((id) => !id) || new Set(ids).size !== ids.length) {
              throw new Error("source bundle case IDs must be non-empty and unique");
            }
            process.stdout.write(ids.join("\n"));
          ')
          mapfile -t available_case_ids <<< "$bundle_case_ids"
          original_four=(
            double-tempest-impermanence
            unchained-replacement
            accel-synchro-trigger-window
            lost-target-continue-resolution
          )
          new_six=(
            tearlaments-scream-activation-window
            mind-scan-red-lotus-public-hand
            harmonia-topologic-field-activation
            photon-emperor-mausoleum-extra-summon
            timaeus-gaze-dragoon-one-destruction
            memento-cactus-avramax-direct-attack
          )
          case_args=()
          case "$CASE_SCOPE" in
            four)
              required_case_ids=("${original_four[@]}")
              ;;
            new-six)
              required_case_ids=("${new_six[@]}")
              if [ "${#available_case_ids[@]}" -ne 6 ] && [ "${#available_case_ids[@]}" -ne 10 ]; then
                echo "case_scope new-six requires a 6-case or 10-case source bundle" >&2
                exit 1
              fi
              ;;
            ten)
              required_case_ids=("${original_four[@]}" "${new_six[@]}")
              if [ "${#available_case_ids[@]}" -ne 10 ]; then
                echo "case_scope ten requires a 10-case source bundle" >&2
                exit 1
              fi
              ;;
            *) echo "Unsupported case scope" >&2; exit 1 ;;
          esac
          for case_id in "${required_case_ids[@]}"; do
            if ! printf '%s\n' "${available_case_ids[@]}" | grep -Fqx -- "$case_id"; then
              echo "source bundle is missing case $case_id" >&2
              exit 1
            fi
            case_args+=(--case "$case_id")
          done
          selected_case_count=${#required_case_ids[@]}
          planned=$((selected_case_count * ${#efforts[@]}))
          if [ "$planned" -gt "$MAX_CALLS" ]; then
            echo "Planned calls $planned exceed max_calls $MAX_CALLS" >&2
            exit 1
          fi
          args=()
          for effort in "${efforts[@]}"; do args+=(--effort "$effort"); done
          if [ -s artifacts/direct-relay-result-checkpoint.json ]; then
            args+=(--recover-running-as-outcome-unknown)
          fi
          node scripts/local-relay-effort-experiment.mjs \
            --snapshots artifacts/direct-relay-source-bundle.json \
            --model "$RELAY_MODEL" \
            "${args[@]}" \
            "${case_args[@]}" \
            --output artifacts/direct-relay-result-checkpoint.json \
            --timeout-ms 900000 \
            --max-calls "$MAX_CALLS"

      - name: Score completed checkpoint offline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/score-admin-model-experiment.mjs \
            --report artifacts/direct-relay-result-checkpoint.json \
            --output artifacts/direct-relay-scored.json

      - name: Upload frozen bundle, checkpoint, and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-relay-relay-gpt-5.6-sol-${{ github.run_id }}
          path: |
            artifacts/direct-relay-source-bundle.json
            artifacts/direct-relay-result-checkpoint.json
            artifacts/direct-relay-scored.json
          if-no-files-found: warn
          retention-days: 14
