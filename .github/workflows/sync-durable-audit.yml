name: Sync durability audit (no model calls)
on:
  push:
    branches: [fix/sync-durable-increments-20260921]
    paths: [.github/workflows/sync-durable-audit.yml]
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 848ce8d4ed2506982f97665a8012a2c110929fd2
          fetch-depth: 1
          persist-credentials: false
      - name: Export pinned sources and published manifests without provider credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/durability-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/durability-audit/source-sha.txt"
          tar -czf "$RUNNER_TEMP/durability-audit/source-code.tgz" backend scripts tests config public app src package.json pnpm-lock.yaml .github/workflows 2>/dev/null || tar -czf "$RUNNER_TEMP/durability-audit/source-code.tgz" backend scripts tests config package.json pnpm-lock.yaml .github/workflows
          tar -czf "$RUNNER_TEMP/durability-audit/source-data.tgz" data/cards.json data/rulings.json data/qa-index.json data/ocg-rule-corpus.json data/rag-data-revision-manifest.json data/snapshot-meta.json data/gemini-rule-qa-v1/canonical-manifest.json data/gemini-rule-qa-v1/manifest.json data/gemini-rule-qa-v1/qa-records.json.gz data/gemini-rule-qa-v1/rule-records.json.gz data/cloud-evidence-v1/cloud-evidence-manifest.json 2>/dev/null || true
          gh api repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325 --jq '{id,state,path}' > "$RUNNER_TEMP/durability-audit/workflow-state.json"
          gh api repos/coldiceh/ocg-ruling-assistant/actions/runs/35555797334/jobs --jq '[.jobs[]|{id,status,conclusion,steps}]' > "$RUNNER_TEMP/durability-audit/active-run.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-durability-source-${{ github.run_id }}
          path: ${{ runner.temp }}/durability-audit/*
          if-no-files-found: error
          retention-days: 3
