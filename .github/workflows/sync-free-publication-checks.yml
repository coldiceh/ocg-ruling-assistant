name: Verify complete sync publication gate
on:
  push:
    branches: [fix/sync-reliability-20260921]
    paths: [.github/workflows/sync-free-publication-checks.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sync-reliability-20260921
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Update the budget contract assertion without weakening the cap
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='tests/deployment-workflows.test.mjs';const s=fs.readFileSync(p,'utf8');
          const from='  assert.match(workflow, /vars\\.EVIDENCE_PREPROCESS_MAX_USD/u);';
          const to='  assert.match(workflow, /--batch-budget-usd 1/u);\n  assert.doesNotMatch(workflow, /--report-only-cost|vars\\.EVIDENCE_PREPROCESS_MAX_USD/u);';
          if(s.split(from).length!==2)throw Error('deployment_test_baseline_mismatch');fs.writeFileSync(p,s.replace(from,to));
          NODE
          git diff --check
      - name: Run all sync snapshot gates and retry regressions without providers
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/sync-ygoresources-selection.test.mjs tests/sync-ocg-rule.test.mjs tests/source-freshness.test.mjs tests/rag-data-source-file.test.mjs tests/rag-data-revision-manifest.test.mjs tests/rag-runtime-bundle.test.mjs tests/rag-runtime-deployment-safety.test.mjs tests/gemini-qa-tools.test.mjs tests/gemini-rule-qa-assets.test.mjs tests/cloud-evidence-assets.test.mjs tests/cloud-evidence-incremental-sync.test.mjs tests/evidence-vector-index.test.mjs tests/deployment-workflows.test.mjs tests/sync-snapshot-publication.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/rag-runtime-parity.test.mjs tests/sync-ygoresources-cursor.test.mjs tests/cloud-sync-resume.test.mjs tests/sync-reliability.test.mjs | tee "$RUNNER_TEMP/publication-tests.log"
      - name: Publish only the tested assertion change to this temporary branch
        run: |
          set -euo pipefail
          git add tests/deployment-workflows.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(sync): require fixed capped batch admission in deployment checks'
          git push origin HEAD:fix/sync-reliability-20260921
          git rev-parse HEAD > "$RUNNER_TEMP/tested-commit.txt"
          git ls-files --stage tests/deployment-workflows.test.mjs > "$RUNNER_TEMP/source-blob.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-publication-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/publication-tests.log
            ${{ runner.temp }}/tested-commit.txt
            ${{ runner.temp }}/source-blob.txt
          if-no-files-found: warn
          retention-days: 3
