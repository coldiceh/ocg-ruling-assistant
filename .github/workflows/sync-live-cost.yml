name: Read current synchronization cost
on:
  push:
    branches: [fix/sync-durable-increments-20260921]
    paths: [.github/workflows/sync-live-cost.yml]
permissions: {}
jobs:
  cost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f0c9a411077f87bc84c3738cf0bd35f9b179ee51
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read existing six-field cost summary using one HMGET only
        env:
          EVIDENCE_PREPROCESS_CACHE_NAMESPACE: ${{ vars.EVIDENCE_PREPROCESS_CACHE_NAMESPACE }}
          UPSTASH_BUDGET_KV_REST_API_URL: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_URL }}
          UPSTASH_BUDGET_KV_REST_API_TOKEN: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {createUpstashRedisCommand} from './scripts/lib/evidence-preprocess-cloud.mjs';
          const ns=process.env.EVIDENCE_PREPROCESS_CACHE_NAMESPACE,batch='64198715d3c7819a53a7128bba8998eac5915ab33ee82874148fefec16591d1c';
          if(ns!=='ocg-daily-sync-20260920')throw Error('cache_namespace_changed_no_read');
          const command=createUpstashRedisCommand({url:process.env.UPSTASH_BUDGET_KV_REST_API_URL,token:process.env.UPSTASH_BUDGET_KV_REST_API_TOKEN});
          const r=await command(['HMGET',`evidence-sync-batch:v1:{${ns}}:${batch}`,'schema','batch','limit','spent','held','seed']);
          if(!Array.isArray(r)||r[0]!=='1'||r[1]!==batch)throw Error('existing_batch_unavailable');
          const [limit,spent,held,seed]=r.slice(2).map(Number);
          if(![limit,spent,held,seed].every(Number.isSafeInteger)||limit!==1e9||spent<0||held<0||seed<0)throw Error('existing_batch_summary_invalid');
          const summary={asOf:new Date().toISOString(),readCommands:1,modelCalls:0,budgetMutations:0,costBasis:'configured_price_usage_not_supplier_invoice',knownBatchSpendUsd:spent/1e9,unresolvedReservationsUsd:held/1e9,remainingUsd:(limit-spent-held)/1e9,originalCarryUsd:seed/1e9,increaseSinceVerifiedPreviousRunUsd:(spent-776450572)/1e9};
          await fs.mkdir(process.env.RUNNER_TEMP+'/live-cost',{recursive:true});await fs.writeFile(process.env.RUNNER_TEMP+'/live-cost/summary.json',JSON.stringify(summary,null,2));console.log('LIVE_SYNC_COST '+JSON.stringify(summary));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-live-cost-${{ github.run_id }}
          path: ${{ runner.temp }}/live-cost/summary.json
          if-no-files-found: error
          retention-days: 3
