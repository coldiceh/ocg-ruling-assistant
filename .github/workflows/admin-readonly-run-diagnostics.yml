name: Astra five literal question-only requests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-literal-q5-20260924
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/codex/astra-literal-q5-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: pilot-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Answer exactly five original questions with Astra low
        env:
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          PILOT_ARCHIVE_KEY: ${{ secrets.ASTRA_Q5_ARCHIVE_KEY_20260924 }}
          PILOT_INPUT_FILE: pilot-runtime/inputs.enc.json
          PILOT_OUTPUT_DIR: ${{ runner.temp }}/astra-literal-q5
        run: node pilot-runtime/run-bai-pilot.mjs
      - name: Preserve encrypted results and checkpoints
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: astra-literal-q5-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/astra-literal-q5/*.enc.json
          if-no-files-found: warn
          retention-days: 3
