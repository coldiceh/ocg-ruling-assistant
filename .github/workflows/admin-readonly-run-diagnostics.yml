name: Five-question BAI frozen replay
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocg-pilot5-bai-20260923
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/codex/ocg-pilot5-bai-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: pilot-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Replay at most 30 frozen cells
        env:
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          PILOT_ARCHIVE_KEY: ${{ secrets.PILOT_ARCHIVE_KEY_20260923 }}
          PILOT_INPUT_FILE: pilot-runtime/inputs.enc.json
          PILOT_OUTPUT_DIR: ${{ runner.temp }}/bai-pilot-5
        run: node pilot-runtime/run-bai-pilot.mjs
      - name: Preserve encrypted results and checkpoints
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bai-pilot-5-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/bai-pilot-5/*.enc.json
          if-no-files-found: warn
          retention-days: 3
