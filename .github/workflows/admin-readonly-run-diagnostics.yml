name: Astra next ten B54 only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-final90-web-20260924
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/codex/astra-finish-b54-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: pilot-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Answer frozen F and Q cases with Astra low
        env:
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          ASTRA_FINAL90_ARCHIVE_KEY_20260924: ${{ secrets.ASTRA_FINISH_B54_ARCHIVE_KEY_20260924 }}
          ASTRA_FINAL90_INPUT_FILE: pilot-runtime/inputs.enc.json
          ASTRA_FINAL90_OUTPUT_DIR: ${{ runner.temp }}/astra-final90
        run: node pilot-runtime/run-bai-pilot.mjs
      - name: Preserve encrypted results and checkpoints
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: astra-final90-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/astra-final90/*.enc.json
          if-no-files-found: warn
          retention-days: 3
