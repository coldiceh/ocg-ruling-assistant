name: Stop uncapped sync and install budget-speed repair
on:
  push:
    branches: [fix/sync-budget-speed-20260920]
    paths:
      - .github/workflows/ocg-sync-maintenance-20260920.yml
      - .github/ocg-sync-budget-speed.patch.b64
permissions: {}
concurrency:
  group: ocg-sync-maintenance-20260920
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'coldiceh/ocg-ruling-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: coldiceh/ocg-ruling-assistant
      EXPECTED_MAIN: 8ef60b0d00d4216751a3b23f25eb8015351caadc
    steps:
      - name: Stop uncapped synchronization and disable automatic execution
        shell: bash
        run: |
          set -euo pipefail
          gh workflow disable sync-data.yml
          run=35544091500
          path="$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .path)"
          test "$path" = .github/workflows/sync-data.yml
          status="$(gh run view "$run" --json status --jq .status)"
          if [ "$status" != completed ]; then gh run cancel "$run"; fi
          for n in $(seq 1 90); do
            status="$(gh run view "$run" --json status --jq .status)"
            if [ "$status" = completed ]; then break; fi
            sleep 2
          done
          test "$status" = completed
          gh run view "$run" --json databaseId,status,conclusion,url
          echo 'OLD RUN STOPPED; sync-data.yml DISABLED. No model calls are authorized by this maintenance job.'
      - name: Checkout maintenance commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect verified repair payload
        id: payload
        shell: bash
        run: |
          if [ -f .github/ocg-sync-budget-speed.patch.b64 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Stop-only phase complete. Repair payload has not been published yet.'
          fi
      - name: Setup Node for offline tests
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify baseline and apply hash-checked patch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          source = pathlib.Path('.github/ocg-sync-budget-speed.patch.b64')
          patch = gzip.decompress(base64.b64decode(source.read_text().strip(), validate=True))
          expected = 'd0a875ca0f5c0f45af95df66900d7bedbd79f57d0e38ca4b06cf588112cbc0ea'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Repair patch SHA256 mismatch; no code will be applied')
          pathlib.Path('/tmp/ocg-sync-budget-speed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ocg-sync-budget-speed.patch
          git apply /tmp/ocg-sync-budget-speed.patch
          git diff --check
      - name: Run 93 focused tests with no provider credentials
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/evidence-navigation-output-recovery.test.mjs \
            tests/evidence-generation-transport.test.mjs \
            tests/evidence-preprocess-navigation.test.mjs \
            tests/evidence-preprocess-cloud.test.mjs \
            tests/sync-bounded-evidence-assets.test.mjs \
            tests/bai-evidence-generation-profile.test.mjs \
            tests/evidence-preprocess-run-cost.test.mjs \
            tests/evidence-sync-budget-speed.test.mjs
          for f in scripts/lib/evidence-sync-batch-budget.mjs scripts/lib/evidence-sync-progress.mjs scripts/lib/evidence-preprocess-cache.mjs scripts/lib/evidence-preprocess-cloud.mjs scripts/prepare-evidence-navigation.mjs scripts/refresh-gemini-source-embeddings.mjs scripts/sync-bounded-evidence-assets.mjs; do
            node --check "$f"
          done
      - name: Publish tested repair without restarting paid sync
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config credential.helper '!gh auth git-credential'
          git add -- .github/workflows/sync-data.yml scripts/lib/evidence-preprocess-cache.mjs scripts/lib/evidence-preprocess-cloud.mjs scripts/lib/evidence-sync-batch-budget.mjs scripts/lib/evidence-sync-progress.mjs scripts/prepare-evidence-navigation.mjs scripts/refresh-gemini-source-embeddings.mjs scripts/sync-bounded-evidence-assets.mjs tests/evidence-preprocess-run-cost.test.mjs tests/evidence-sync-budget-speed.test.mjs tests/helpers/evidence-sync-budget-fixture.mjs tests/sync-bounded-evidence-assets.test.mjs
          git rm -- .github/workflows/ocg-sync-maintenance-20260920.yml .github/ocg-sync-budget-speed.patch.b64
          git diff --cached --check
          git commit -m 'fix(sync): cap unfinished batches at USD 1, batch cache reads and expose progress'
          git push origin HEAD:refs/heads/main
          echo "REPAIR COMMIT: $(git rev-parse HEAD)"
          echo 'REPAIR PUBLISHED. Scheduled sync remains disabled. No paid sync was started.'
          {
            echo '## Synchronization repair installed'
            echo "Commit: $(git rev-parse HEAD)"
            echo 'Old uncapped run stopped; synchronization workflow disabled.'
            echo 'USD 1 limit persists across retries until a successful publication.'
            echo '93 focused offline tests and JavaScript syntax checks passed.'
            echo 'Paid synchronization was NOT restarted; existing provider costs are not reversed.'
          } >> "$GITHUB_STEP_SUMMARY"
