name: Verify budget-speed repair for connector publication
on:
  push:
    branches: [fix/sync-budget-speed-20260920]
    paths:
      - .github/workflows/ocg-sync-maintenance-20260920.yml
      - .github/ocg-sync-budget-speed.patch.b64
permissions: {}
concurrency:
  group: ocg-sync-maintenance-20260920
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'coldiceh/ocg-ruling-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: coldiceh/ocg-ruling-assistant
      EXPECTED_MAIN: 8ef60b0d00d4216751a3b23f25eb8015351caadc
    steps:
      - name: Confirm the uncapped sync is stopped and disabled
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/workflows/296804325" --jq .state)" = disabled_manually
          test "$(gh run view 35544091500 --json status --jq .status)" = completed
          gh run view 35544091500 --json databaseId,status,conclusion,url
          gh api "repos/$GH_REPO/actions/workflows/296804325" --jq '{state,path}'
      - name: Checkout the maintenance payload
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node for offline tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify baseline and apply SHA256-checked repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          raw=base64.b64decode(pathlib.Path('.github/ocg-sync-budget-speed.patch.b64').read_text().strip(),validate=True)
          code=gzip.decompress(raw)
          if hashlib.sha256(code).hexdigest()!='ffd79db3d980a70433c7b47ebd4d85df6823525b67be15fffd9afcd9a99a06fe':
              raise SystemExit('Repair integrity check failed')
          pathlib.Path('/tmp/repair-sync.py').write_bytes(code)
          PY
          python3 /tmp/repair-sync.py
          git diff --check
      - name: Run focused offline regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/evidence-navigation-output-recovery.test.mjs tests/evidence-generation-transport.test.mjs tests/evidence-preprocess-navigation.test.mjs tests/evidence-preprocess-cloud.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/bai-evidence-generation-profile.test.mjs tests/evidence-preprocess-run-cost.test.mjs tests/evidence-sync-budget-speed.test.mjs
          for f in scripts/lib/evidence-sync-batch-budget.mjs scripts/lib/evidence-sync-progress.mjs scripts/lib/evidence-preprocess-cache.mjs scripts/lib/evidence-preprocess-cloud.mjs scripts/prepare-evidence-navigation.mjs scripts/refresh-gemini-source-embeddings.mjs scripts/sync-bounded-evidence-assets.mjs; do node --check "$f"; done
      - name: Store tested source tree excluding workflow changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          import json,pathlib
          paths=['scripts/lib/evidence-preprocess-cache.mjs','scripts/lib/evidence-preprocess-cloud.mjs','scripts/lib/evidence-sync-batch-budget.mjs','scripts/lib/evidence-sync-progress.mjs','scripts/prepare-evidence-navigation.mjs','scripts/refresh-gemini-source-embeddings.mjs','scripts/sync-bounded-evidence-assets.mjs','tests/evidence-preprocess-run-cost.test.mjs','tests/evidence-sync-budget-speed.test.mjs','tests/helpers/evidence-sync-budget-fixture.mjs','tests/sync-bounded-evidence-assets.test.mjs']
          body={'base_tree':'da87861845dd879cd46a4d30ba0cd9549f8fa8f0','tree':[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in paths]}
          pathlib.Path('/tmp/repair-tree.json').write_text(json.dumps(body))
          PY
          tree="$(gh api --method POST "repos/$GH_REPO/git/trees" --input /tmp/repair-tree.json --jq .sha)"
          echo "VERIFIED_SOURCE_TREE=$tree"
          echo '95 offline tests passed. Only source objects stored; no commit or branch update; no provider calls.'
          echo "VERIFIED_SOURCE_TREE=$tree" >> "$GITHUB_STEP_SUMMARY"
