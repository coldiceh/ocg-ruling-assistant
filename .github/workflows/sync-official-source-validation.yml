name: Validate official rule source compatibility
on:
  push:
    branches: [fix/sync-reliability-20260921]
    paths: [.github/workflows/sync-official-source-validation.yml]
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sync-reliability-20260921
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply scoped provenance and preflight changes
        run: |
          python maintenance/patch-official-source.py
          python -c 'from pathlib import Path; p=Path("scripts/lib/manual-capture-evidence-selection.mjs"); p.write_bytes(p.read_bytes().replace(b"\r\n",b"\n"))'
          node --check scripts/build-cloud-evidence-assets.mjs
          node --check scripts/lib/manual-capture-evidence-selection.mjs
          git diff --check
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/sync-data.yml")'
      - name: Compare legacy cloud-plan failures against unchanged main source
        run: node maintenance/compare-cloud-plan-baseline.mjs
      - name: Run provenance, cache and publication tests without providers
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/sync-official-reference.test.mjs tests/cloud-evidence-assets.test.mjs tests/cloud-evidence-incremental-sync.test.mjs tests/cloud-evidence-provider.test.mjs tests/sync-reliability.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/sync-ygoresources-selection.test.mjs tests/sync-ocg-rule.test.mjs tests/deployment-workflows.test.mjs tests/gemini-rule-qa-assets.test.mjs | tee "$RUNNER_TEMP/source-tests.log"
      - name: Validate complete fresh corpus before any model work
        env:
          SYNC_ALL_RELEASED_CARDS: 'true'
          SYNC_ONLY_RELEASED_CARDS: 'true'
          CARD_INDEX_LANGUAGES: en,ja
          FETCH_CONCURRENCY: '8'
          MAX_QA_TOTAL: '250'
          OCG_RULE_MAX_PAGES: '240'
        run: |
          set -euo pipefail
          node scripts/sync-data.mjs
          node scripts/sync-ocg-rule.mjs
          node scripts/build-rag-data-revision-manifest.mjs
          node scripts/build-cloud-evidence-assets.mjs --data-dir data --validate-only | tee "$RUNNER_TEMP/source-preflight.json"
          node scripts/build-cloud-evidence-assets.mjs --data-dir data --output-dir "$RUNNER_TEMP/cloud-source" | tee "$RUNNER_TEMP/cloud-source.json"
          node maintenance/audit-cpu-hash-diff.mjs
      - name: Export tested workflow and commit permitted source files only
        run: |
          set -euo pipefail
          cp .github/workflows/sync-data.yml "$RUNNER_TEMP/tested-sync-data.yml"
          git hash-object .github/workflows/sync-data.yml > "$RUNNER_TEMP/workflow-blob.txt"
          git add scripts/lib/manual-capture-evidence-selection.mjs scripts/build-cloud-evidence-assets.mjs tests/sync-official-reference.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sync): preserve explicit official source provenance'
          git push origin HEAD:fix/sync-reliability-20260921
          git ls-files --stage scripts/lib/manual-capture-evidence-selection.mjs scripts/build-cloud-evidence-assets.mjs tests/sync-official-reference.test.mjs > "$RUNNER_TEMP/source-blobs.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/tested-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-tests.log
            ${{ runner.temp }}/source-preflight.json
            ${{ runner.temp }}/cloud-source.json
            ${{ runner.temp }}/cpu-hash-diff.json
            ${{ runner.temp }}/source-blobs.txt
            ${{ runner.temp }}/tested-commit.txt
            ${{ runner.temp }}/tested-sync-data.yml
            ${{ runner.temp }}/workflow-blob.txt
            ${{ runner.temp }}/cloud-plan-baseline-comparison.json
          retention-days: 3
          if-no-files-found: warn
