name: Validate official rule source compatibility
on:
  push:
    branches: [fix/sync-reliability-20260921]
    paths: [.github/workflows/sync-official-source-validation.yml]
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sync-reliability-20260921
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply scoped provenance and preflight changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import difflib
          p=Path('scripts/lib/manual-capture-evidence-selection.mjs');old=p.read_bytes().decode();s=old.replace('\r\n','\n')
          marker='  const declaredTier = String(record.sourceTier || "").trim();\n  const identity'
          assert s.count(marker)==1
          s=s.replace(marker,'''  const declaredTier = String(record.sourceTier || "").trim();
            // Explicit, consistent official-reference provenance takes precedence over
            // the legacy rule-doc fallback. It is not an official database ruling.
            if (declaredAuthority === "official_reference" && record.official === true
                && (!declaredTier || declaredTier === "S0_OFFICIAL_REFERENCE")) {
              return "official_reference";
            }
            const identity''',1)
          a=s.index('  if ((hasAuthority && record.sourceAuthority !== "community_reference")',s.index('function referenceRecordCandidate'));b=s.index('  const id = itemId(record);',a)
          s=s[:a]+'''  const officialReference = record.sourceAuthority === "official_reference"
              && record.official === true
              && (!hasTier || record.sourceTier === "S0_OFFICIAL_REFERENCE");
            const communityReference = (!hasAuthority || record.sourceAuthority === "community_reference")
              && (!hasTier || record.sourceTier === "S2_COMMUNITY_REFERENCE")
              && (!hasOfficial || record.official === false);
            if (!officialReference && !communityReference) {
              throw new Error("manual_capture_reference_record_authority_conflict");
            }
            const authority = officialReference ? "official_reference" : "community_reference";
            const tier = officialReference ? "S0_OFFICIAL_REFERENCE" : "S2_COMMUNITY_REFERENCE";
          '''+s[b:]
          s=s.replace('...(!hasAuthority ? { sourceAuthority: "community_reference" } : {}),','...(!hasAuthority ? { sourceAuthority: authority } : {}),',1).replace('...(!hasTier ? { sourceTier: "S2_COMMUNITY_REFERENCE" } : {}),','...(!hasTier ? { sourceTier: tier } : {}),',1).replace('...(!hasOfficial ? { official: false } : {}),','...(!hasOfficial ? { official: officialReference } : {}),',1)
          a=old.splitlines(keepends=True);b=s.splitlines(keepends=True);out=[]
          for tag,i,j,k,l in difflib.SequenceMatcher(a=[x.rstrip('\r\n') for x in a],b=[x.rstrip('\r\n') for x in b],autojunk=False).get_opcodes():
            if tag=='equal':out+=a[i:j]
            elif tag in ('insert','replace'):
              eol='\r\n' if i<len(a) and a[i].endswith('\r\n') else '\n';out+=[x.rstrip('\r\n')+eol for x in b[k:l]]
          p.write_bytes(''.join(out).encode())
          p=Path('scripts/build-cloud-evidence-assets.mjs');s=p.read_text();a=s.index('export async function buildCloudEvidenceAssets(');b=s.index('  const data = await loadRagData(dataDir);',a)
          s=s[:a]+"async function loadCloudEvidenceCandidates(dataDir) {\n  if (!dataDir) throw new Error('dataDir is required');\n"+s[b:]
          a=s.index('  const corpusMetadata = await writeCloudEvidenceCorpus')
          s=s[:a]+'''  return {dataRevision, ruleBytes, candidates};
          }
          export async function validateCloudEvidenceSources({dataDir} = {}) {
            const {dataRevision, candidates} = await loadCloudEvidenceCandidates(dataDir);
            return {dataRevision, candidateCount:candidates.length, validated:true,
              externalCalls:0, embeddingComputations:0};
          }
          export async function buildCloudEvidenceAssets({dataDir, outputDir, vectorDir} = {}) {
            if (!dataDir || !outputDir) throw new Error('dataDir and new outputDir are required');
            const {dataRevision, ruleBytes, candidates} = await loadCloudEvidenceCandidates(dataDir);
            await fs.mkdir(outputDir, {recursive: false});
          '''+s[a:]
          a=s.index('  console.log(JSON.stringify(await buildCloudEvidenceAssets(')
          s=s[:a]+'''  const options={dataDir:option('--data-dir'), outputDir:option('--output-dir'), vectorDir:option('--vector-dir')};
            console.log(JSON.stringify(args.includes('--validate-only')
              ?await validateCloudEvidenceSources(options):await buildCloudEvidenceAssets(options)));
          }
          ''';p.write_text(s)
          p=Path('.github/workflows/sync-data.yml');s=p.read_text();s=s.replace('tests/evidence-sync-budget-speed.test.mjs\n','tests/evidence-sync-budget-speed.test.mjs tests/sync-official-reference.test.mjs\n',1)
          s=s.replace('      - name: Incrementally refresh current navigation and Gemini vectors\n','      - name: Validate cloud source identities and provenance before paid calls\n        run: node scripts/build-cloud-evidence-assets.mjs --data-dir data --validate-only\n\n      - name: Incrementally refresh current navigation and Gemini vectors\n',1)
          block='''      - name: Preserve unpublished source and derived assets after downstream failure
                  if: ${{ failure() && steps.data_validation.outcome == 'success' }}
                  uses: actions/upload-artifact@v4
                  with:
                    name: sync-resume-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
                    path: |
                      data/*.json
                      data/*.json.gz
                      data/rag-runtime-v1/**
                      data/cloud-evidence-v1/**
                      data/gemini-rule-qa-v1/**
                      data/rule-embedding-v1/**
                      data/qa-embedding-v1/**
                    if-no-files-found: error
                    retention-days: 3
                    compression-level: 1
          '''
          # Correct the literal block indentation to the existing workflow level.
          lines=block.splitlines();block='\n'.join([lines[0]]+[line[10:] for line in lines[1:]])+'\n'
          s=s.replace('      - name: Preserve bounded preprocessing diagnostics\n',block+'\n      - name: Preserve bounded preprocessing diagnostics\n',1);p.write_text(s)
          PY
          node --check scripts/build-cloud-evidence-assets.mjs
          node --check scripts/lib/manual-capture-evidence-selection.mjs
          git diff --check
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/sync-data.yml")'
      - name: Run provenance, source, cache and publication contract tests without providers
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/sync-official-reference.test.mjs tests/cloud-evidence-assets.test.mjs tests/cloud-evidence-incremental-sync.test.mjs tests/cloud-evidence-provider.test.mjs tests/cloud-evidence-plan.test.mjs tests/sync-official-reference.test.mjs tests/sync-reliability.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/sync-ygoresources-selection.test.mjs tests/sync-ocg-rule.test.mjs tests/deployment-workflows.test.mjs tests/gemini-rule-qa-assets.test.mjs | tee "$RUNNER_TEMP/source-tests.log"
      - name: Validate complete fresh source corpus before any model work
        env:
          SYNC_ALL_RELEASED_CARDS: 'true'
          SYNC_ONLY_RELEASED_CARDS: 'true'
          CARD_INDEX_LANGUAGES: en,ja
          FETCH_CONCURRENCY: '8'
          MAX_QA_TOTAL: '250'
          OCG_RULE_MAX_PAGES: '240'
        run: |
          set -euo pipefail
          node scripts/sync-data.mjs
          node scripts/sync-ocg-rule.mjs
          node scripts/build-rag-data-revision-manifest.mjs
          node scripts/build-cloud-evidence-assets.mjs --data-dir data --validate-only | tee "$RUNNER_TEMP/source-preflight.json"
          node scripts/build-cloud-evidence-assets.mjs --data-dir data --output-dir "$RUNNER_TEMP/cloud-source" | tee "$RUNNER_TEMP/cloud-source.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import z from 'node:zlib';
          const c=JSON.parse(z.gunzipSync(fs.readFileSync(process.env.RUNNER_TEMP+'/cloud-source/corpus.json.gz')));
          const old=JSON.parse(fs.readFileSync('data/cloud-evidence-v1/evidence-vector-index.json'));
          const hashes=new Set(old.orderedContentHashes),all=new Set(c.documents.flatMap(d=>d.views.map(v=>v.textSha256)));
          const report={total:all.size,reused:[...all].filter(h=>hashes.has(h)).length,missing:[...all].filter(h=>!hashes.has(h)).length,officialReferences:c.candidates.filter(c=>c.body.sourceAuthority==='official_reference').length,modelCalls:0};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/cpu-plan.json',JSON.stringify(report));console.log(JSON.stringify(report));
          NODE
      - name: Commit only the four verified source and test files
        run: |
          set -euo pipefail
          git add .github/workflows/sync-data.yml scripts/lib/manual-capture-evidence-selection.mjs scripts/build-cloud-evidence-assets.mjs tests/sync-official-reference.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sync): preserve official rule provenance and preflight sources before billing'
          git push origin HEAD:fix/sync-reliability-20260921
          git ls-files --stage .github/workflows/sync-data.yml scripts/lib/manual-capture-evidence-selection.mjs scripts/build-cloud-evidence-assets.mjs tests/sync-official-reference.test.mjs > "$RUNNER_TEMP/source-blobs.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-tests.log
            ${{ runner.temp }}/source-preflight.json
            ${{ runner.temp }}/cloud-source.json
            ${{ runner.temp }}/cpu-plan.json
            ${{ runner.temp }}/source-blobs.txt
          retention-days: 3
          if-no-files-found: warn
