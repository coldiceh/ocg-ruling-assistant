name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to publish. Callers that push during a workflow should pass main.
        required: false
        type: string
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A reusable caller may have pushed a newer commit than its original
          # GITHUB_SHA. Publishing the requested ref avoids deploying stale data.
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Record exact source commit
        id: release
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build static site
        run: |
          mkdir -p _site/data
          cp -R assets _site/assets
          cp -R src _site/src
          cp index.html config.json .nojekyll _site/
          cp data/cards-lite.json data/snapshot-meta.json _site/data/
          node scripts/build-public-release.mjs _site/data/release.json
          test -s _site/index.html
          test -s _site/assets/bg-day.png
          test -s _site/assets/bg-night.png
          test -s _site/src/app.js
          test -s _site/src/styles.css
          test -s _site/config.json
          test -s _site/data/cards-lite.json
          test -s _site/data/snapshot-meta.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout published source for version verification
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.release_commit }}

      - name: Verify frontend and backend release identity without model calls
        run: |
          export EXPECTED_COMMIT="$(git rev-parse HEAD)"
          node scripts/verify-public-release.mjs "${{ steps.deployment.outputs.page_url }}"
