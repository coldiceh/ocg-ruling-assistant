name: Verify CPU completion repair
on:
  push:
    branches: [fix/cpu-checkpoint-completion-20260921]
    paths: [.github/workflows/verify-cpu-completion-repair.yml]
permissions: {}
concurrency:
  group: verify-cpu-completion-repair-20260921
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply narrow CPU orchestration and cache-floor changes
        run: |
          python3 scripts/maintenance-cpu-completion-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/sync-cpu-selection.test.mjs');s=p.read_text()
          old="\\x1b[0m'))),{...progress,sequence:4});"
          assert s.count(old)==1
          s=s.replace(old,"\\x1b[0m')),{...progress,sequence:4});")
          s+='''
          test('scheduled default input zero uses the validated saved sequence, not the initial selector input',()=>{
            const state={reason:'paused_time_continuing',sequence:5,maxSequence:8,progress,published:false};
            const text=log(5)+'  SYNC_RESUME_SEQUENCE: 0\\nSYNC_CPU_STATUS '+JSON.stringify(state)+'\\n';
            assert.equal(parseCpuCheckpointLog(text).sequence,5);
            for(const patch of [{published:true},{sequence:99},{progress:{...progress,computedRows:1}},{reason:'complete'}]) {
              assert.throws(()=>parseCpuCheckpointLog(log(5)+'SYNC_CPU_STATUS '+JSON.stringify({...state,...patch})+'\\n'));
            }
            assert.throws(()=>parseCpuCheckpointLog(log(5)+'SYNC_CPU_STATUS broken-json\\n'));
          });
          test('a failed recovery selector cannot cause a fresh paid restart on tomorrow schedule',async t=>{
            const job={name:'sync',steps:[{name:'Select saved CPU checkpoint before new source or paid work',conclusion:'failure'}]};
            const {options}=await fakeEnvironment(t,{job});
            await assert.rejects(selectCheckpoint(options),/previous_checkpoint_failure_no_paid_restart/);
          });
          test('a post-restore failure must be repaired without re-entering paid source stages',async t=>{
            const job={id:999,name:'sync',steps:[{name:'Select saved CPU checkpoint before new source or paid work',conclusion:'success'}]};
            const {options}=await fakeEnvironment(t,{job,log:'2026-09-21T15:00:00.000Z SYNC_CPU_SELECTION {"mode":"cpu_resume"}\\n'});
            await assert.rejects(selectCheckpoint(options),/previous_checkpoint_failure_no_paid_restart/);
          });
          '''
          p.write_text(s)
          p=Path('scripts/select-sync-cpu-checkpoint.mjs');s=p.read_text()
          old="  if (sequences.length > 1) fail('sync_checkpoint_sequence_ambiguous');\n  const sequence = sequences[0] ?? 0;"
          new="""  const states = lines.filter(line=>line.startsWith('SYNC_CPU_STATUS '))
              .map(line=>JSON.parse(line.slice('SYNC_CPU_STATUS '.length)));
            if(states.length>1 || (!states.length && sequences.length>1)) fail('sync_checkpoint_sequence_ambiguous');
            const sequence = states.length ? states[0].sequence : (sequences[0] ?? 0);"""
          assert s.count(old)==1;s=s.replace(old,new)
          old="  return {schemaVersion:1,status:'paused_time',totalRows:cachedRows+pendingRows,\n    cachedRows,computedRows,remainingRows:pendingRows-computedRows,sequence};"
          new="""  const checkpoint = {schemaVersion:1,status:'paused_time',totalRows:cachedRows+pendingRows,
              cachedRows,computedRows,remainingRows:pendingRows-computedRows,sequence};
            if(states.length) {
              if(states[0].published !== false || !['paused_time_continuing','chain_limit_reached'].includes(states[0].reason))
                fail('sync_checkpoint_structured_status_invalid');
              validateProgressProof(states[0].progress,checkpoint);
            }
            return checkpoint;"""
          assert s.count(old)==1;s=s.replace(old,new)
          old="    if(explicit) fail('sync_requested_checkpoint_not_cpu_pause');"
          new="""    if(explicit) fail('sync_requested_checkpoint_not_cpu_pause');
              if(job?.steps?.some(s=>['Select saved CPU checkpoint before new source or paid work',
                'Restore verified unpublished snapshot without paid calls'].includes(s.name) && s.conclusion==='failure'))
                fail('sync_previous_checkpoint_failure_no_paid_restart');
              if(job?.steps?.some(s=>s.name==='Select saved CPU checkpoint before new source or paid work' && s.conclusion==='success')) {
                const previousLog=stripVTControlCharacters(await command('gh',['api',`repos/${repo}/actions/jobs/${job.id}/logs`,'--allow-escape-sequences']));
                if(previousLog.split(/\\r?\\n/).some(line=>/^\\d{4}-\\d{2}-\\d{2}T[\\d:.]+Z SYNC_CPU_SELECTION /.test(line)))
                  fail('sync_previous_checkpoint_failure_no_paid_restart');
              }"""
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          PY
      - name: Check syntax and run all targeted no-provider regression tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpu-completion-validated"
          node --check scripts/select-sync-cpu-checkpoint.mjs
          node --check scripts/restore-sync-checkpoint.mjs
          node --check tests/sync-cpu-selection.test.mjs
          python3 -m py_compile scripts/embed-missing-cloud-evidence.py
          ruby -ryaml -e 'YAML.load_file(".github/workflows/sync-data.yml"); puts "Workflow YAML parsed"'
          git diff --check
          node --test tests/evidence-navigation-output-recovery.test.mjs tests/evidence-generation-transport.test.mjs tests/evidence-preprocess-navigation.test.mjs tests/evidence-preprocess-cloud.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/bai-evidence-generation-profile.test.mjs tests/evidence-preprocess-run-cost.test.mjs tests/evidence-sync-budget-speed.test.mjs tests/sync-official-reference.test.mjs tests/sync-cpu-continuation.test.mjs tests/sync-cpu-selection.test.mjs tests/cloud-evidence-incremental-sync.test.mjs tests/cloud-sync-resume.test.mjs tests/deployment-workflows.test.mjs tests/sync-snapshot-publication.test.mjs | tee "$RUNNER_TEMP/cpu-completion-validated/node-tests.txt"
          python3 -m unittest discover -s tests -p 'test_cloud_embedding_cache.py'
          python3 -m unittest discover -s tests -p 'test_cloud_embedding_progress.py'
      - name: Prove actual stopped checkpoint selection without restoring or executing models
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RESUME_RUN_ID: '35614487948'
          SYNC_RESUME_SEQUENCE: '5'
        run: |
          set -euo pipefail
          node scripts/select-sync-cpu-checkpoint.mjs | tee "$RUNNER_TEMP/cpu-completion-validated/real-selection.txt"
      - name: Save exact validated source blobs without changing any branch or published data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const files=['scripts/select-sync-cpu-checkpoint.mjs','tests/sync-cpu-selection.test.mjs',
            'scripts/restore-sync-checkpoint.mjs','scripts/embed-missing-cloud-evidence.py',
            '.github/workflows/sync-data.yml','tests/sync-cpu-continuation.test.mjs'];
          const directory=path.join(process.env.RUNNER_TEMP,'cpu-completion-validated');
          const manifest={baseCommit:'f0c9a411077f87bc84c3738cf0bd35f9b179ee51',validationRun:process.env.GITHUB_RUN_ID,
            state:'validated_not_published',modelApiCalls:0,files:[]};
          for(const file of files) {
            const content=await fs.readFile(file,'utf8');
            const bytes=Buffer.from(content);
            const sha=createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const result=JSON.parse(execFileSync('gh',['api','--method','POST',`repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,'--input','-'],
              {input:JSON.stringify({content,encoding:'utf-8'}),encoding:'utf8',stdio:['pipe','pipe','pipe']}));
            if(result.sha!==sha)throw Error('uploaded_source_blob_mismatch');
            const destination=path.join(directory,file);await fs.mkdir(path.dirname(destination),{recursive:true});await fs.writeFile(destination,content);
            manifest.files.push({path:file,sha,size:bytes.length});
          }
          await fs.writeFile(path.join(directory,'validated-manifest.json'),JSON.stringify(manifest,null,2));
          console.log('VALIDATED_CPU_REPAIR '+JSON.stringify(manifest));
          NODE
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-completion-validated-${{ github.run_id }}
          path: ${{ runner.temp }}/cpu-completion-validated
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
