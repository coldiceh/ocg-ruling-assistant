name: Verify CPU completion repair
on:
  push:
    branches: [fix/cpu-checkpoint-completion-20260921]
    paths: [.github/workflows/verify-cpu-completion-repair.yml]
permissions: {}
concurrency:
  group: verify-cpu-completion-repair-20260921
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply narrow CPU orchestration and cache-floor changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def edit(file, old, new, count=1):
              p=Path(file);s=p.read_text()
              assert s.count(old)==count,(file,old,s.count(old))
              p.write_text(s.replace(old,new))
          restore='scripts/restore-sync-checkpoint.mjs'
          edit(restore,'export const MAX_CPU_CONTINUATIONS = 4;','export const MAX_CPU_CONTINUATIONS = 8;')
          edit(restore,'/^(?:0|[1-4])$/','/^(?:0|[1-8])$/')
          old="console.log(ready?'SYNC CPU CHECKPOINT: progress saved; queue a CPU-only continuation.':'SYNC CPU: no automatic continuation (not a time checkpoint, no progress, or chain limit reached).');"
          new="""const reason=ready?'paused_time_continuing':inputs.sequence>=MAX_CPU_CONTINUATIONS?'chain_limit_reached':!progress?'progress_missing':'not_a_positive_time_checkpoint';
              console.log('SYNC_CPU_STATUS '+JSON.stringify({reason,sequence:inputs.sequence,maxSequence:MAX_CPU_CONTINUATIONS,progress,published:false}));
              if(process.env.GITHUB_STEP_SUMMARY) await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,
                `## CPU synchronization status\\n${reason}; continuation ${inputs.sequence}/${MAX_CPU_CONTINUATIONS}.\\n\\n`+
                `Remaining rows: ${progress?.remainingRows ?? 'unknown'}. This run has NOT published new data.\\n`);
              console.log(ready?'SYNC CPU CHECKPOINT: saved; continuing without source or paid work.':'SYNC CPU STOPPED: '+reason+'; saved data retained; no automatic paid restart.');"""
          edit(restore,old,new)
          workflow='.github/workflows/sync-data.yml'
          p=Path(workflow);s=p.read_text()
          s=s.replace("${{ inputs.resume_run_id || '' }}","${{ steps.select_resume.outputs.run_id || '' }}")
          s=s.replace("${{ inputs.resume_sequence || '0' }}","${{ steps.select_resume.outputs.sequence || '0' }}")
          before='      - name: Restore verified unpublished snapshot without paid calls\n'
          select="""      - name: Select saved CPU checkpoint before new source or paid work
                  id: select_resume
                  env:
                    GH_TOKEN: ${{ github.token }}
                    SYNC_RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
                    SYNC_RESUME_SEQUENCE: ${{ inputs.resume_sequence || '0' }}
                  run: node scripts/select-sync-cpu-checkpoint.mjs

          """
          # Dedent the YAML block without changing its initial step indentation.
          select='\n'.join(line[8:] if line.startswith('        ') else line for line in select.split('\n'))
          assert before in s;s=s.replace(before,select+before)
          assert s.count('timeout-minutes: 120')==1;s=s.replace('timeout-minutes: 120','timeout-minutes: 240')
          assert s.count('timeout-minutes: 40')==1
          s=s.replace('timeout-minutes: 40',"timeout-minutes: ${{ steps.restore.outputs.resumed == 'true' && 180 || 40 }}")
          s=s.replace('Bounded CPU continuation sequence, 0 through 4','Bounded CPU continuation sequence, 0 through 8; 0 derives the next saved sequence')
          s=s.replace('^['+'1-4]$', '^['+'1-8]$')
          old='          CLOUD_EMBED_MAX_SECONDS: "2100"'
          new="""          CLOUD_EMBED_MAX_SECONDS: ${{ steps.restore.outputs.resumed == 'true' && 10500 || 2100 }}
                    CLOUD_EMBED_REQUIRED_CACHED_ROWS: ${{ steps.select_resume.outputs.required_cached_rows || '' }}
                    CLOUD_EMBED_EXPECTED_ROWS: ${{ steps.select_resume.outputs.expected_rows || '' }}"""
          new='\n'.join(line[10:] if line.startswith('                    ') else line for line in new.split('\n'))
          assert old in s;s=s.replace(old,new)
          a=s.index('      - name: Restore completed incremental embedding rows\n')
          b=s.index('\n      - name:',a+10)
          block="""      - name: Restore completed incremental embedding rows
                  uses: actions/cache/restore@v5
                  with:
                    path: .cache/cloud-embeddings
                    key: ${{ steps.select_resume.outputs.cache_key || format('cloud-embedding-rows-v1-{0}-{1}-{2}', runner.os, github.run_id, github.run_attempt) }}
                    restore-keys: ${{ steps.restore.outputs.resumed != 'true' && format('cloud-embedding-rows-v1-{0}-', runner.os) || '' }}
                    fail-on-cache-miss: ${{ steps.restore.outputs.resumed == 'true' }}
          """
          block='\n'.join(line[8:] if line.startswith('        ') else line for line in block.split('\n'))
          s=s[:a]+block.rstrip()+s[b:];p.write_text(s)
          embed='scripts/embed-missing-cloud-evidence.py'
          guard='''def require_cached_progress(cached_rows, total_rows):
              floor = os.environ.get("CLOUD_EMBED_REQUIRED_CACHED_ROWS", "").strip()
              expected = os.environ.get("CLOUD_EMBED_EXPECTED_ROWS", "").strip()
              if not floor and not expected:
                  return
              if not floor.isascii() or not floor.isdigit() or not expected.isascii() or not expected.isdigit():
                  fail("cloud_sync_saved_cache_proof_invalid")
              if int(expected) != total_rows or cached_rows < int(floor) or int(floor) > total_rows:
                  fail("cloud_sync_saved_cache_progress_regressed_no_recompute")


          '''
          guard='\n'.join(line[10:] if line.startswith('          ') else line for line in guard.split('\n'))
          edit(embed,'def sha256_text(value):',guard+'def sha256_text(value):')
          edit(embed,'    progress_file = os.environ.get("CLOUD_EMBED_PROGRESS_PATH")',
            '    require_cached_progress(len(texts)-len(pending), len(texts))\n    progress_file = os.environ.get("CLOUD_EMBED_PROGRESS_PATH")')
          tests='tests/sync-cpu-continuation.test.mjs'
          edit(tests,"['123','5']","['123','9']")
          edit(tests,'stop at four','stop at eight')
          edit(tests,'shouldContinueCpu(p,4),false','shouldContinueCpu(p,8),false')
          PY
      - name: Check syntax and run all targeted no-provider regression tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpu-completion-validated"
          node --check scripts/select-sync-cpu-checkpoint.mjs
          node --check scripts/restore-sync-checkpoint.mjs
          python3 -m py_compile scripts/embed-missing-cloud-evidence.py
          ruby -ryaml -e 'YAML.load_file(".github/workflows/sync-data.yml"); puts "Workflow YAML parsed"'
          git diff --check
          node --test tests/evidence-navigation-output-recovery.test.mjs tests/evidence-generation-transport.test.mjs tests/evidence-preprocess-navigation.test.mjs tests/evidence-preprocess-cloud.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/bai-evidence-generation-profile.test.mjs tests/evidence-preprocess-run-cost.test.mjs tests/evidence-sync-budget-speed.test.mjs tests/sync-official-reference.test.mjs tests/sync-cpu-continuation.test.mjs tests/sync-cpu-selection.test.mjs tests/cloud-evidence-incremental-sync.test.mjs tests/cloud-sync-resume.test.mjs tests/deployment-workflows.test.mjs tests/sync-snapshot-publication.test.mjs | tee "$RUNNER_TEMP/cpu-completion-validated/node-tests.txt"
          python3 -m unittest discover -s tests -p 'test_cloud_embedding_cache.py'
          python3 -m unittest discover -s tests -p 'test_cloud_embedding_progress.py'
      - name: Prove actual stopped checkpoint selection without restoring or executing models
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RESUME_RUN_ID: '35614487948'
          SYNC_RESUME_SEQUENCE: '5'
        run: |
          set -euo pipefail
          node scripts/select-sync-cpu-checkpoint.mjs | tee "$RUNNER_TEMP/cpu-completion-validated/real-selection.txt"
      - name: Save exact validated source blobs without changing any branch or published data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const files=['scripts/select-sync-cpu-checkpoint.mjs','tests/sync-cpu-selection.test.mjs',
            'scripts/restore-sync-checkpoint.mjs','scripts/embed-missing-cloud-evidence.py',
            '.github/workflows/sync-data.yml','tests/sync-cpu-continuation.test.mjs'];
          const directory=path.join(process.env.RUNNER_TEMP,'cpu-completion-validated');
          const manifest={baseCommit:'f0c9a411077f87bc84c3738cf0bd35f9b179ee51',validationRun:process.env.GITHUB_RUN_ID,
            state:'validated_not_published',modelApiCalls:0,files:[]};
          for(const file of files) {
            const content=await fs.readFile(file,'utf8');
            const bytes=Buffer.from(content);
            const sha=createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const result=JSON.parse(execFileSync('gh',['api','--method','POST',`repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,'--input','-'],
              {input:JSON.stringify({content,encoding:'utf-8'}),encoding:'utf8',stdio:['pipe','pipe','pipe']}));
            if(result.sha!==sha)throw Error('uploaded_source_blob_mismatch');
            const destination=path.join(directory,file);await fs.mkdir(path.dirname(destination),{recursive:true});await fs.writeFile(destination,content);
            manifest.files.push({path:file,sha,size:bytes.length});
          }
          await fs.writeFile(path.join(directory,'validated-manifest.json'),JSON.stringify(manifest,null,2));
          console.log('VALIDATED_CPU_REPAIR '+JSON.stringify(manifest));
          NODE
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-completion-validated-${{ github.run_id }}
          path: ${{ runner.temp }}/cpu-completion-validated
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
