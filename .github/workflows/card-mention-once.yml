name: Diagnose one production card-name extraction
on:
  push:
    branches: [codex/card-mention-fix-20261002]
    paths:
      - .github/workflows/card-mention-once.yml
      - scripts/probe-card-mention-once.mjs
permissions:
  contents: read
concurrency:
  group: card-mention-once-20261002
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Extract card names once using the production BAI route
        env:
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          UPSTASH_BUDGET_KV_REST_API_URL: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_URL }}
          UPSTASH_BUDGET_KV_REST_API_TOKEN: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_TOKEN }}
        run: node scripts/probe-card-mention-once.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-mention-private-20261002
          path: card-mention-diagnostic/
          retention-days: 3
