name: Publish preserved synchronized snapshot without model calls
on:
  push:
    branches: [fix/sync-publish-recovery-20260921]
    paths: [.github/workflows/sync-publish-recovery.yml]
permissions: {}
concurrency:
  group: sync-ruling-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Require the exact verified code and the single obsolete-test failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bbb77d6a859d16a88b681196ff05c098f4e2be32
          test "$(gh api repos/coldiceh/ocg-ruling-assistant/actions/runs/35553275082 --jq .conclusion)" = success
          test "$(gh api repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325 --jq .state)" = active
          gh api repos/coldiceh/ocg-ruling-assistant/actions/runs/35552958499/jobs > "$RUNNER_TEMP/jobs.json"
          gh api --allow-escape-sequences repos/coldiceh/ocg-ruling-assistant/actions/jobs/106191034830/logs > "$RUNNER_TEMP/old-job.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const job=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/jobs.json')).jobs.find(j=>j.id===106191034830);
          assert.equal(job.status,'completed');assert.equal(job.conclusion,'failure');
          const required=['Validate synchronized data','Incrementally refresh current navigation and Gemini vectors','Promote verified bounded evidence assets','Build and verify versioned RAG runtime bundle','Verify runtime behavior matches the raw snapshot','Incrementally synchronize and mechanically verify cloud evidence assets','Verify source freshness and index ordering','Check source and generated-file syntax','Preserve a failed validated snapshot for diagnosis'];
          for(const name of required)assert.equal(job.steps.find(s=>s.name===name)?.conclusion,'success',name);
          assert.deepEqual(job.steps.filter(s=>s.conclusion==='failure').map(s=>s.name),['Test updated snapshot']);
          const log=fs.readFileSync(process.env.RUNNER_TEMP+'/old-job.log','utf8');
          assert.ok(log.includes('EVIDENCE_PREPROCESS_MAX_USD'));assert.ok(log.includes('data sync rebuilds and commits the versioned RAG runtime before synchronization checks'));assert.ok(/(?:ℹ|#) fail 1(?:\r?\n|\s)/u.test(log));
          NODE
      - name: Restore the already-generated validated snapshot, not a new source fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/coldiceh/ocg-ruling-assistant/actions/runs/35552958499/artifacts > "$RUNNER_TEMP/artifacts.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/artifacts.json')).artifacts;
          const a=rows.filter(a=>a.name==='failed-synced-rag-data-35552958499-1'&&!a.expired);assert.equal(a.length,1);assert.ok(/^sha256:[a-f0-9]{64}$/.test(a[0].digest));fs.writeFileSync(process.env.RUNNER_TEMP+'/snapshot-artifact.json',JSON.stringify(a[0]));
          NODE
          artifact_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/snapshot-artifact.json")).id')
          gh api --allow-escape-sequences "repos/coldiceh/ocg-ruling-assistant/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/snapshot.zip"
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']);a=json.loads((root/'snapshot-artifact.json').read_text());b=(root/'snapshot.zip').read_bytes()
          assert hashlib.sha256(b).hexdigest()==a['digest'].split(':')[1]
          stage=root/'restored-data';stage.mkdir();dirs={'rag-runtime-v1','cloud-evidence-v1','gemini-rule-qa-v1','rule-embedding-v1','qa-embedding-v1'}
          with zipfile.ZipFile(root/'snapshot.zip') as z:
            for f in z.infolist():
              p=pathlib.PurePosixPath(f.filename)
              assert not p.is_absolute() and '..' not in p.parts
              if p.parts[0]=='data':p=pathlib.PurePosixPath(*p.parts[1:])
              assert p.parts and ((len(p.parts)==1 and (p.name.endswith('.json') or p.name.endswith('.json.gz'))) or p.parts[0] in dirs)
              assert (f.external_attr>>16)&0o170000!=0o120000
              if f.is_dir():continue
              target=stage/pathlib.Path(*p.parts);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(f))
          for name in ['cards.json','rulings.json','qa-index.json','ocg-rule-corpus.json','rag-data-revision-manifest.json']:assert (stage/name).is_file(),name
          for name in dirs:assert (stage/name).is_dir(),name
          for p in stage.iterdir():
            target=pathlib.Path('data')/p.name
            if p.is_dir():
              if target.exists():shutil.rmtree(target)
              shutil.copytree(p,target)
            else:shutil.copy2(p,target)
          for n in ['cards-lite.json','snapshot-meta.json']:shutil.copy2(pathlib.Path('data')/n,pathlib.Path('public/data')/n)
          print('Restored validated existing snapshot; no source retrieval or model calls.')
          PY
      - name: Verify all restored assets and corrected publication gates without providers
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm check:data
          pnpm check:freshness
          pnpm check:rag-runtime
          node scripts/build-gemini-rule-qa-assets.mjs --stage verify --data-dir data --output-dir data/gemini-rule-qa-v1
          node scripts/sync-cloud-evidence-assets.mjs --data-dir data --cloud-dir data/cloud-evidence-v1 --check-only
          pnpm check
          node --test --test-concurrency=1 tests/rag-runtime-parity.test.mjs tests/sync-ygoresources-selection.test.mjs tests/sync-ocg-rule.test.mjs tests/source-freshness.test.mjs tests/rag-data-source-file.test.mjs tests/rag-data-revision-manifest.test.mjs tests/rag-runtime-bundle.test.mjs tests/rag-runtime-deployment-safety.test.mjs tests/gemini-qa-tools.test.mjs tests/gemini-rule-qa-assets.test.mjs tests/cloud-evidence-assets.test.mjs tests/cloud-evidence-incremental-sync.test.mjs tests/evidence-vector-index.test.mjs tests/deployment-workflows.test.mjs tests/sync-snapshot-publication.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/sync-reliability.test.mjs tests/sync-ygoresources-cursor.test.mjs tests/cloud-sync-resume.test.mjs | tee "$RUNNER_TEMP/recovered-tests.log"
          python -m unittest discover -s tests -p 'test_cloud_embedding_cache.py'
          git diff --check
      - name: Commit snapshot changes
        id: commit
        run: bash scripts/publish-synced-snapshot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synchronized-snapshot-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/snapshot-artifact.json
            ${{ runner.temp }}/recovered-tests.log
          retention-days: 3
          if-no-files-found: warn
  deploy-pages:
    needs: publish
    if: needs.publish.outputs.data_changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      checkout_ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
