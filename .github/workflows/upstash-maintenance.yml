name: Read-only storage and hosted verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: maintenance-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run bounded verification
        env:
          ADMIN_MODEL_LAB_PASSWORD: ${{ secrets.ADMIN_MODEL_LAB_PASSWORD }}
        run: node maintenance-runtime/verify-hosted.mjs > hosted-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-hosted
          path: hosted-verification.json
          retention-days: 3
