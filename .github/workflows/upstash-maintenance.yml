name: Read-only Upstash complete inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: maintenance-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read aggregate storage metadata
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_TOKEN }}
        run: node maintenance-runtime/inventory.mjs > inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-inventory
          path: inventory.json
          retention-days: 3
