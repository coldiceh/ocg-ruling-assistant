name: One-off bounded b.ai GPT-6 Luna card smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/multilingual-source-display
    paths:
      - scripts/smoke-bai-card-luna.mjs

permissions:
  contents: read

concurrency:
  group: one-off-bai-card-luna-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Call the two production card model entrypoints once each
        env:
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
        run: node scripts/smoke-bai-card-luna.mjs
