name: Sync ruling data

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Completed main run whose verified unpublished snapshot should be resumed (no paid calls)'
        required: false
        default: ''
      resume_sequence:
        description: 'Bounded CPU continuation sequence, 0 through 8; 0 derives the next saved sequence'
        required: false
        default: '0'
  schedule:
    - cron: "0 19 * * *"

permissions: {}

concurrency:
  group: sync-ruling-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Leave room for the existing CPU embedding path, bounded preprocessing,
    # and post-rebase checks. Paid progress persists in the runner file cache.
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
      checkpoint_ready: ${{ steps.checkpoint.outputs.ready }}
      next_sequence: ${{ steps.checkpoint.outputs.next_sequence }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_dispatch lets the caller choose a ref, but synchronization
          # must always build on the repository's reviewed main history.
          ref: refs/heads/main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select saved CPU checkpoint before new source or paid work
        id: select_resume
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
          SYNC_RESUME_SEQUENCE: ${{ inputs.resume_sequence || '0' }}
        run: node scripts/select-sync-cpu-checkpoint.mjs

      - name: Restore verified unpublished snapshot without paid calls
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RESUME_RUN_ID: ${{ steps.select_resume.outputs.run_id || '' }}
          SYNC_RESUME_SEQUENCE: ${{ steps.select_resume.outputs.sequence || '0' }}
        run: node scripts/restore-sync-checkpoint.mjs

      - name: Test navigation output recovery (no provider calls)
        run: node --test tests/evidence-navigation-output-recovery.test.mjs tests/evidence-generation-transport.test.mjs tests/evidence-preprocess-navigation.test.mjs tests/evidence-preprocess-cloud.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/bai-evidence-generation-profile.test.mjs tests/evidence-preprocess-run-cost.test.mjs tests/evidence-sync-budget-speed.test.mjs tests/sync-official-reference.test.mjs tests/sync-cpu-continuation.test.mjs tests/sync-cpu-selection.test.mjs

      - name: Sync YGOResources snapshot
        if: steps.restore.outputs.resumed != 'true'
        env:
          SYNC_ALL_RELEASED_CARDS: "true"
          SYNC_ONLY_RELEASED_CARDS: "true"
          CARD_INDEX_LANGUAGES: "en,ja"
          FETCH_CONCURRENCY: "8"
          # Keep each CPU embedding increment within the job's time budget;
          # the existing cursor rotates coverage and retains prior Q&A.
          MAX_QA_TOTAL: "250"
        run: node scripts/sync-data.mjs

      - name: Sync OCG rule corpus
        if: steps.restore.outputs.resumed != 'true'
        env:
          OCG_RULE_BASE_URL: "https://ocg-rule.readthedocs.io/zh-cn/latest/"
          OCG_RULE_MAX_PAGES: "240"
        run: node scripts/sync-ocg-rule.mjs

      - name: Preserve readable source fields and bodies
        if: steps.restore.outputs.resumed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readable-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/readable-sources/*.txt
          if-no-files-found: error
          retention-days: 3

      - name: Validate synchronized data
        id: data_validation
        run: |
          pnpm check:data

      - name: Diff ruling snapshot
        if: steps.restore.outputs.resumed != 'true'
        run: |
          pnpm diff:rulings
          cp data/cards-lite.json data/snapshot-meta.json public/data/

      - name: Build current evidence index
        if: steps.restore.outputs.resumed != 'true'
        run: pnpm build:evidence

      - name: Build versioned RAG data revision manifest
        if: steps.restore.outputs.resumed != 'true'
        run: pnpm build:rag-revision

      - name: Validate cloud source identities and provenance before paid calls
        run: node scripts/build-cloud-evidence-assets.mjs --data-dir data --validate-only

      - name: Restore paid preprocessing results from file cache
        if: steps.restore.outputs.resumed != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/bounded-evidence-cache
          key: evidence-preprocess-disk-v1-${{ vars.EVIDENCE_PREPROCESS_CACHE_NAMESPACE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: evidence-preprocess-disk-v1-${{ vars.EVIDENCE_PREPROCESS_CACHE_NAMESPACE }}-

      - name: Incrementally refresh current navigation and Gemini vectors
        if: steps.restore.outputs.resumed != 'true'
        id: bounded_sync
        env:
          # Carry the last saved usage report from cancelled run 35544091500 once.
          # This does not count it again as a new request or reset on retry.
          EVIDENCE_SYNC_CARRY_BASELINE: "64198715d3c7819a53a7128bba8998eac5915ab33ee82874148fefec16591d1c"
          EVIDENCE_SYNC_CARRY_USD: "0.66364875"
          EVIDENCE_PREPROCESS_CACHE_NAMESPACE: ${{ vars.EVIDENCE_PREPROCESS_CACHE_NAMESPACE }}
          GEMINI_RULE_QA_API_KEY: ${{ secrets.GEMINI_RULE_QA_API_KEY }}
          RAG_EVIDENCE_BAI_API_KEY: ${{ secrets.RAG_EVIDENCE_BAI_API_KEY }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          UPSTASH_BUDGET_KV_REST_API_URL: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_URL }}
          UPSTASH_BUDGET_KV_REST_API_TOKEN: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_TOKEN }}
        run: |
          # USD 1 per unpublished batch; no automatic top-up or reset on retry.
          node scripts/sync-bounded-evidence-assets.mjs \
            --data-dir data \
            --out-dir "$RUNNER_TEMP/bounded-evidence-stage" \
            --cache-dir "$RUNNER_TEMP/bounded-evidence-cache" \
            --generation-profile config/evidence-generation/bai-gpt-6-luna-medium-theoretical.json \
            --batch-budget-usd 1 \
            --navigation-concurrency 4 \
            --progress \
            --cloud \
            --execute

      - name: Save paid preprocessing results even after a failed batch
        if: ${{ always() && steps.bounded_sync.outcome != 'skipped' && steps.bounded_sync.outcome != '' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/bounded-evidence-cache
          key: evidence-preprocess-disk-v1-${{ vars.EVIDENCE_PREPROCESS_CACHE_NAMESPACE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report this run's model API cost
        if: ${{ always() && steps.bounded_sync.outcome != 'skipped' }}
        continue-on-error: true
        run: node scripts/lib/evidence-preprocess-run-cost.mjs "$RUNNER_TEMP/bounded-evidence-stage/run-cost.json"

      - name: Report CPU-only continuation model cost
        if: steps.restore.outputs.resumed == 'true'
        run: 'echo "Resume model API cost: USD 0; paid stages skipped; previous paid results reused."'

      - name: Promote verified bounded evidence assets
        if: steps.restore.outputs.resumed != 'true'
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(report.publishable !== true) throw new Error("bounded_sync_not_publishable")' \
            "$RUNNER_TEMP/bounded-evidence-stage/bounded-evidence-sync-report.json"
          mkdir -p "$RUNNER_TEMP/bounded-evidence-previous"
          for asset in gemini-rule-qa-v1 rule-embedding-v1 qa-embedding-v1; do
            if [ -d "data/$asset" ]; then mv "data/$asset" "$RUNNER_TEMP/bounded-evidence-previous/$asset"; fi
            mv "$RUNNER_TEMP/bounded-evidence-stage/$asset" "data/$asset"
          done
          node scripts/build-gemini-rule-qa-assets.mjs \
            --stage verify \
            --data-dir data \
            --output-dir data/gemini-rule-qa-v1

      - name: Build and verify versioned RAG runtime bundle
        id: runtime_validation
        run: |
          pnpm build:rag-runtime
          pnpm check:rag-runtime

      - name: Verify runtime behavior matches the raw snapshot
        id: runtime_parity
        run: node --test --test-concurrency=1 tests/rag-runtime-parity.test.mjs

      - name: Setup Python for incremental cloud embeddings
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache fixed Qwen embedding snapshot
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: qwen3-embedding-0.6b-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3

      - name: Install fixed CPU embedding runtime
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check \
            transformers==4.56.1 safetensors==0.6.2

      - name: Restore completed incremental embedding rows
        uses: actions/cache/restore@v5
        with:
          path: .cache/cloud-embeddings
          key: ${{ steps.select_resume.outputs.cache_key || format('cloud-embedding-rows-v1-{0}-{1}-{2}', runner.os, github.run_id, github.run_attempt) }}
          restore-keys: ${{ steps.restore.outputs.resumed != 'true' && format('cloud-embedding-rows-v1-{0}-', runner.os) || '' }}
          fail-on-cache-miss: ${{ steps.restore.outputs.resumed == 'true' }}

      - name: Incrementally synchronize and mechanically verify cloud evidence assets
        id: cloud_sync
        timeout-minutes: ${{ steps.restore.outputs.resumed == 'true' && 180 || 40 }}
        env:
          CLOUD_EMBED_CPU_THREADS: "4"
          CLOUD_EMBED_BATCH_SIZE: "8"
          CLOUD_EMBED_CACHE_DIR: .cache/cloud-embeddings
          CLOUD_EMBED_PROGRESS_PATH: ${{ runner.temp }}/cloud-sync-progress.json
          # Stop between batches while time remains to persist progress.
          CLOUD_EMBED_MAX_SECONDS: ${{ steps.restore.outputs.resumed == 'true' && 10500 || 2100 }}
          CLOUD_EMBED_REQUIRED_CACHED_ROWS: ${{ steps.select_resume.outputs.required_cached_rows || '' }}
          CLOUD_EMBED_EXPECTED_ROWS: ${{ steps.select_resume.outputs.expected_rows || '' }}
          TOKENIZERS_PARALLELISM: "false"
        run: |
          node scripts/sync-cloud-evidence-assets.mjs \
            --data-dir data \
            --cloud-dir data/cloud-evidence-v1 \
            --python python

      - name: Preserve completed vectors even after an interrupted increment
        id: cloud_cache_save
        if: ${{ always() && steps.cloud_sync.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/cloud-embeddings
          key: cloud-embedding-rows-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify source freshness and index ordering
        run: pnpm check:freshness

      - name: Check source and generated-file syntax
        id: source_check
        run: |
          node --test tests/audit-identity-boundaries.test.mjs
          pnpm check
          git diff --check

      - name: Test updated snapshot
        id: snapshot_tests
        run: node --test --test-concurrency=1 tests/sync-ygoresources-selection.test.mjs tests/sync-ocg-rule.test.mjs tests/source-freshness.test.mjs tests/rag-data-source-file.test.mjs tests/rag-data-revision-manifest.test.mjs tests/rag-runtime-bundle.test.mjs tests/rag-runtime-deployment-safety.test.mjs tests/gemini-qa-tools.test.mjs tests/gemini-rule-qa-assets.test.mjs tests/cloud-evidence-assets.test.mjs tests/cloud-evidence-incremental-sync.test.mjs tests/evidence-vector-index.test.mjs tests/deployment-workflows.test.mjs tests/sync-snapshot-publication.test.mjs tests/sync-bounded-evidence-assets.test.mjs

      - name: Verify interrupted sync recovery
        run: |
          node --test tests/sync-ygoresources-cursor.test.mjs tests/cloud-sync-resume.test.mjs
          python -m unittest discover -s tests -p 'test_cloud_embedding_cache.py'
          python -m unittest discover -s tests -p 'test_cloud_embedding_progress.py'

      - name: Preserve a failed validated snapshot for diagnosis
        if: >-
          ${{ always()
            && steps.data_validation.outcome == 'success'
            && steps.runtime_validation.outcome == 'success'
            && steps.runtime_parity.outcome == 'success'
            && steps.source_check.outcome == 'success'
            && steps.snapshot_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-synced-rag-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/*.json
            data/*.json.gz
            data/rag-runtime-v1/**
            data/cloud-evidence-v1/**
            data/gemini-rule-qa-v1/**
            data/rule-embedding-v1/**
            data/qa-embedding-v1/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Preserve unpublished source and derived assets after downstream failure
        id: resume_snapshot
        if: ${{ failure() && steps.data_validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-resume-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/*.json
            data/*.json.gz
            data/rag-runtime-v1/**
            data/cloud-evidence-v1/**
            data/gemini-rule-qa-v1/**
            data/rule-embedding-v1/**
            data/qa-embedding-v1/**
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

      - name: Preserve CPU progress diagnostics
        if: ${{ always() && steps.cloud_sync.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-sync-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-sync-progress.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Mark saved CPU time checkpoint for bounded continuation
        id: checkpoint
        if: ${{ failure() && steps.cloud_sync.outcome == 'failure' && steps.resume_snapshot.outcome == 'success' && steps.cloud_cache_save.outcome == 'success' }}
        env:
          CLOUD_EMBED_PROGRESS_PATH: ${{ runner.temp }}/cloud-sync-progress.json
          SYNC_RESUME_RUN_ID: ${{ steps.select_resume.outputs.run_id || '' }}
          SYNC_RESUME_SEQUENCE: ${{ steps.select_resume.outputs.sequence || '0' }}
        run: node scripts/restore-sync-checkpoint.mjs --check-progress

      - name: Preserve bounded preprocessing diagnostics
        if: ${{ always() && steps.bounded_sync.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: bounded-daily-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bounded-evidence-stage/bounded-evidence-sync-report.json
            ${{ runner.temp }}/bounded-evidence-stage/run-cost.json
          if-no-files-found: warn
          retention-days: 3

      - name: Report ruling sync status
        run: pnpm report:rulings

      - name: Commit snapshot changes
        id: commit
        run: bash scripts/publish-synced-snapshot.sh

      - name: Export an unpublished snapshot after publication failure
        if: ${{ failure() && steps.commit.outputs.snapshot_commit != '' }}
        env:
          SNAPSHOT_COMMIT: ${{ steps.commit.outputs.snapshot_commit }}
        run: |
          git archive --format=tar --output "$RUNNER_TEMP/unpublished-synced-rag-data.tar" \
            "$SNAPSHOT_COMMIT" -- data public/data/cards-lite.json public/data/snapshot-meta.json

      - name: Preserve the unpublished generated snapshot
        if: ${{ failure() && steps.commit.outputs.snapshot_commit != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-synced-rag-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unpublished-synced-rag-data.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  continue-cpu:
    name: Continue saved CPU work without source fetching or paid calls
    needs: sync
    if: ${{ always() && needs.sync.result == 'failure' && needs.sync.outputs.checkpoint_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue one bounded CPU-only continuation on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME_RUN_ID: ${{ github.run_id }}
          RESUME_SEQUENCE: ${{ needs.sync.outputs.next_sequence }}
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ && "$RESUME_SEQUENCE" =~ ^[1-8]$ ]]
          gh api --method POST "repos/$GH_REPO/actions/workflows/sync-data.yml/dispatches" \
            -f ref=main -f "inputs[resume_run_id]=$RESUME_RUN_ID" -f "inputs[resume_sequence]=$RESUME_SEQUENCE"
          echo "CPU work continues from the saved unpublished snapshot. This run has NOT published new data."

  deploy-pages:
    name: Deploy synchronized snapshot to GitHub Pages
    needs: sync
    # Pushes made with GITHUB_TOKEN do not start another workflow. Call the
    # reusable Pages workflow explicitly only when this job actually pushed data.
    if: needs.sync.outputs.data_changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      # Publish the newest main rather than the caller's pre-sync GITHUB_SHA.
      checkout_ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
