name: Sync ruling data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions: {}

concurrency:
  group: sync-ruling-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_dispatch lets the caller choose a ref, but synchronization
          # must always build on the repository's reviewed main history.
          ref: refs/heads/main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync YGOResources snapshot
        env:
          SYNC_ALL_RELEASED_CARDS: "true"
          SYNC_ONLY_RELEASED_CARDS: "true"
          CARD_INDEX_LANGUAGES: "en,ja"
          FETCH_CONCURRENCY: "8"
          MAX_QA_TOTAL: "3000"
        run: node scripts/sync-data.mjs

      - name: Sync OCG rule corpus
        env:
          OCG_RULE_BASE_URL: "https://ocg-rule.readthedocs.io/zh-cn/latest/"
          OCG_RULE_MAX_PAGES: "240"
        run: node scripts/sync-ocg-rule.mjs

      - name: Validate synchronized data
        id: data_validation
        run: pnpm check:data

      - name: Diff ruling snapshot
        run: pnpm diff:rulings

      - name: Build current evidence index
        run: pnpm build:evidence

      - name: Build versioned RAG data revision manifest
        run: pnpm build:rag-revision

      - name: Build and verify versioned RAG runtime bundle
        id: runtime_validation
        run: |
          pnpm build:rag-runtime
          pnpm check:rag-runtime

      - name: Verify runtime behavior matches the raw snapshot
        id: runtime_parity
        run: node --test --test-concurrency=1 tests/rag-runtime-parity.test.mjs

      - name: Verify source freshness and index ordering
        run: pnpm check:freshness

      - name: Check source and generated-file syntax
        id: source_check
        run: |
          pnpm check
          git diff --check

      - name: Test updated snapshot
        id: snapshot_tests
        # The repository test command covers every test under tests/ while
        # excluding standalone paid experiment CLIs under scripts/.
        run: pnpm test

      - name: Preserve a failed validated snapshot for diagnosis
        if: >-
          ${{ always()
            && steps.data_validation.outcome == 'success'
            && steps.runtime_validation.outcome == 'success'
            && steps.runtime_parity.outcome == 'success'
            && steps.source_check.outcome == 'success'
            && steps.snapshot_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-synced-rag-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/*.json
            data/rag-runtime-v1/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Report ruling sync status
        run: pnpm report:rulings

      - name: Commit snapshot changes
        id: commit
        run: |
          git fetch --no-tags origin refs/heads/main
          remote_main="$(git rev-parse FETCH_HEAD)"
          checked_out_main="$(git rev-parse HEAD)"
          if [ "$checked_out_main" != "$remote_main" ]; then
            echo "main advanced while synchronization was running; refusing a stale or non-main push" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/rag-runtime-v1/**
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): sync ruling snapshot"
            if ! git merge-base --is-ancestor "$remote_main" HEAD; then
              echo "Generated snapshot escaped the fetched main history" >&2
              exit 1
            fi
            git push origin HEAD:refs/heads/main
            # Set the output only after the push succeeds. A failed push must not
            # publish a snapshot that is absent from main.
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    name: Deploy synchronized snapshot to GitHub Pages
    needs: sync
    # Pushes made with GITHUB_TOKEN do not start another workflow. Call the
    # reusable Pages workflow explicitly only when this job actually pushed data.
    if: needs.sync.outputs.data_changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      # Publish the newest main rather than the caller's pre-sync GITHUB_SHA.
      checkout_ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
