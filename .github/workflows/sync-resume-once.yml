name: Resume capped synchronization once
on:
  push:
    branches: [fix/sync-resume-audit-20260920]
    paths: [.github/workflows/sync-resume-once.yml]
permissions: {}
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify capped main and completed source audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "59a1043910eba2a505eebdb62d2943a0e81593b8"
          node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(".github/workflows/sync-data.yml","utf8");for(const t of ["cron: \"0 19 * * *\"","--batch-budget-usd 1","--navigation-concurrency 4","--progress","0.66364875"])if(!s.includes(t))throw Error("resume_contract_mismatch");if(s.includes("--report-only-cost"))throw Error("uncapped_sync_forbidden");'
          gh run watch 35548871900 --repo coldiceh/ocg-ruling-assistant --exit-status --interval 15
          test "$(gh api repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325 --jq .state)" = active
      - name: Start one capped main run without resetting spending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325/runs?per_page=20' > "$RUNNER_TEMP/sync-runs-before.json"
          node --input-type=module -e 'import fs from "node:fs";const runs=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/sync-runs-before.json","utf8")).workflow_runs;if(runs.some(r=>r.status!=="completed"))throw Error("sync_already_active_no_duplicate_dispatch");'
          gh api --method POST repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325/dispatches -f ref=main
          sleep 5
          gh api 'repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325/runs?per_page=3' --jq '.workflow_runs[] | {id,head_sha,status,conclusion,event,html_url}'
