name: Recover rejected vector request and resume sync
on:
  push:
    branches: [fix/sync-429-recovery-20260921]
    paths: [.github/workflows/sync-429-recovery.yml]
permissions: {}
concurrency:
  group: sync-ruling-data
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sync-429-recovery-20260921
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate completed failure, tested main, active schedule and immutable diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/coldiceh/ocg-ruling-assistant/git/refs/heads/main --jq .object.sha)" = fa9af741a4c7b7ee5f21e01fe418e6757254f2f8
          test "$(gh api repos/coldiceh/ocg-ruling-assistant/actions/runs/35552663510 --jq .conclusion)" = success
          test "$(gh api repos/coldiceh/ocg-ruling-assistant/actions/runs/35549293738 --jq .conclusion)" = failure
          test "$(gh api repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325 --jq .state)" = active
          gh api 'repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325/runs?per_page=20' > "$RUNNER_TEMP/runs.json"
          node --input-type=module -e 'import fs from "node:fs";if(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/runs.json")).workflow_runs.some(r=>r.status!=="completed"))throw Error("another_sync_active");'
          gh api --allow-escape-sequences repos/coldiceh/ocg-ruling-assistant/actions/artifacts/10618446163/zip > "$RUNNER_TEMP/failure.zip"
          echo "45dcfc88b94f4938ba4613f54088c19b642969c09c0df0e55c73dd8b8630e40a  $RUNNER_TEMP/failure.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/proof"
          unzip -q "$RUNNER_TEMP/failure.zip" -d "$RUNNER_TEMP/proof"
          node --check maintenance/reconcile-429.mjs
      - name: Reconcile only the uniquely identified HTTP 429 claim without model calls
        env:
          UPSTASH_BUDGET_KV_REST_API_URL: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_URL }}
          UPSTASH_BUDGET_KV_REST_API_TOKEN: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_TOKEN }}
        run: node maintenance/reconcile-429.mjs "$RUNNER_TEMP/proof/bounded-evidence-sync-report.json" "$RUNNER_TEMP/reconciliation.json"
      - name: Resume one tested main synchronization with original spending and cap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/coldiceh/ocg-ruling-assistant/git/refs/heads/main --jq .object.sha)" = fa9af741a4c7b7ee5f21e01fe418e6757254f2f8
          gh api --method POST repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325/dispatches -f ref=main
          sleep 5
          gh api 'repos/coldiceh/ocg-ruling-assistant/actions/workflows/296804325/runs?per_page=3' --jq '.workflow_runs[] | {id,head_sha,status,conclusion}' | tee "$RUNNER_TEMP/dispatched.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-429-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reconciliation.json
            ${{ runner.temp }}/dispatched.json
          if-no-files-found: warn
          retention-days: 3
