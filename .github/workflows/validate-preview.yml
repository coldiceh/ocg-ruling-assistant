name: Validate preview changes

on:
  push:
    branches:
      - "codex/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and data checks
        run: pnpm run check

      - name: Run the complete free test suite with file isolation
        shell: bash
        run: |
          set +e
          node scripts/run-free-tests.mjs \
            2>&1 | tee "$RUNNER_TEMP/complete-tests.log"
          test_status="${PIPESTATUS[0]}"
          set -e
          if [ "$test_status" -ne 0 ]; then
            # Public tests contain no private evaluation text. Mirror a bounded
            # failure-name summary into a check annotation so a public CI
            # failure can be diagnosed through the checks API without a GitHub
            # web login. Avoid spending the annotation limit on passed tests.
            failure_tail="$(grep -E '^(test at |✖ |  AssertionError|    actual:|    expected:)' \
              "$RUNNER_TEMP/complete-tests.log" | tail -c 12000 || true)"
            if [ -z "$failure_tail" ]; then
              failure_tail="$(tail -c 12000 "$RUNNER_TEMP/complete-tests.log")"
            fi
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            echo "::error title=Complete serial test suite failed::$failure_tail"
            exit "$test_status"
          fi
