name: Validate preview changes

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      evaluation_limit:
        description: Run the one-case pilot first; select 32 only after the pilot succeeds
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "32"

permissions:
  contents: read

concurrency:
  group: validate-preview-${{ github.event.pull_request.number || github.ref }}
  # A paid request may already have reached the relay when cancellation arrives.
  # Queue another run instead of creating an ambiguous, possibly charged retry.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and data checks
        run: pnpm run check

      - name: Run the complete test suite serially
        run: >-
          node --test --test-force-exit --test-concurrency=1
          --test-isolation=none --test-reporter=dot

  private-evaluation:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.action == 'labeled'
        && (github.event.label.name == 'private-pure-llm-evaluation-pilot'
          || github.event.label.name == 'private-pure-llm-evaluation')
        && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      # All paid private evaluations are globally serial for this repository,
      # including runs dispatched from different branches or pull requests.
      group: private-pure-llm-evaluation-${{ github.repository }}
      cancel-in-progress: false
    env:
      RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
      RELAY_BASE_URL: https://api.986310.xyz/v1
      PUBLIC_RULING_MODEL_PROFILE: relay-gpt-5.6-sol-low
      RELAY_MAX_COMPLETION_TOKENS: "8192"
      # GitHub's local backend is not constrained by Vercel's 270-second cap.
      # Keep the inner Relay deadline below the evaluator's full-request limit.
      # Keep the provider deadline below the 300s end-to-end deadline so the
      # backend can return a classified failure before the evaluator aborts.
      RELAY_STREAM_TIMEOUT_MS: "240000"
      API_CHATGPT_DAILY_BUDGET_USD: "10"
      API_DAILY_BUDGET_CNY: "10"
      QUERY_AUDIT_ENABLED: "false"
      HOST: 127.0.0.1
      PORT: "18787"
      # The pilot label is one case; the full label is 32. workflow_dispatch is
      # also available once this workflow reaches the repository default branch.
      EVALUATION_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_limit || (github.event.label.name == 'private-pure-llm-evaluation' && '32' || '1') }}
    steps:
      - name: Checkout the exact preview commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize the private dataset without logging it
        shell: bash
        env:
          PRIVATE_DATASET_BASE64: ${{ secrets.PURE_LLM_EVALUATION_DATASET_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELAY_API_KEY" ] || [ -z "$PRIVATE_DATASET_BASE64" ]; then
            echo "Required private evaluation secrets are not configured" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$PRIVATE_DATASET_BASE64" | base64 --decode > "$RUNNER_TEMP/private-dataset.txt"
          test -s "$RUNNER_TEMP/private-dataset.txt"

      - name: Start the preview branch backend
        shell: bash
        run: |
          set -euo pipefail
          node backend/server.mjs > "$RUNNER_TEMP/private-evaluation-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/private-evaluation-backend.pid"
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error "http://127.0.0.1:$PORT/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Preview backend did not become healthy" >&2
          exit 1

      - name: Generate private candidates serially without a model judge
        id: evaluation
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          node scripts/evaluate-pure-llm-preview.mjs \
            --dataset "$RUNNER_TEMP/private-dataset.txt" \
            --checkpoint-dir "$RUNNER_TEMP/pure-llm-private-checkpoint" \
            --report artifacts/pure-llm-private-public-report.json \
            --base-url "http://127.0.0.1:$PORT" \
            --generate-only \
            --limit "$EVALUATION_LIMIT" \
            --generation-timeout-ms 300000
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify the report contains no private text
        if: always()
        shell: bash
        run: |
          test -s artifacts/pure-llm-private-public-report.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { parseDatasetText } from "./scripts/evaluate-pure-llm-preview.mjs";
          const dataset = parseDatasetText(await readFile(`${process.env.RUNNER_TEMP}/private-dataset.txt`, "utf8"));
          const reportText = await readFile("artifacts/pure-llm-private-public-report.json", "utf8");
          const report = JSON.parse(reportText);
          for (const item of dataset.cases) {
            if (reportText.includes(item.question) || reportText.includes(item.referenceAnswer)) {
              throw new Error("Public report contains private evaluation text");
            }
          }
          const forbiddenKeys = new Set([
            "cases", "judge", "judgments", "verdict", "reviewed", "correct",
            "partiallyCorrect", "incorrect", "judgeFailed", "reviewCoverage",
            "reviewedAccuracy", "strictOverallAccuracy", "judgment",
          ]);
          const visit = (value) => {
            if (!value || typeof value !== "object") return;
            for (const [key, item] of Object.entries(value)) {
              if (forbiddenKeys.has(key)) throw new Error(`Public generation report contains forbidden field: ${key}`);
              visit(item);
            }
          };
          visit(report);
          if (report.mode !== "generate_only") {
            throw new Error("Public report is not generation-only");
          }
          if (report.summary?.total !== Number(process.env.EVALUATION_LIMIT)) {
            throw new Error("Public report selected-case count does not match the requested limit");
          }
          if (
            report.summary?.generated !== Number(process.env.EVALUATION_LIMIT)
            || report.summary?.generationFailed !== 0
          ) {
            throw new Error("Private candidate generation did not complete for every selected case");
          }
          NODE

      - name: Encrypt the private diagnostic checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/pure-llm-private-checkpoint" ]; then
            exit 0
          fi
          archive_key="$(sha256sum "$RUNNER_TEMP/private-dataset.txt" | cut -d ' ' -f 1)"
          tar_args=(pure-llm-private-checkpoint)
          # The backend log may contain provider diagnostics and possibly user
          # material. Include it only inside the encrypted archive so a failed
          # pilot remains diagnosable without publishing plaintext.
          if [ -s "$RUNNER_TEMP/private-evaluation-backend.log" ]; then
            tar_args+=(private-evaluation-backend.log)
          fi
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pure-llm-private-checkpoint.tar.gz" \
            "${tar_args[@]}"
          PRIVATE_ARCHIVE_KEY="$archive_key" openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/pure-llm-private-checkpoint.tar.gz" \
            -out artifacts/pure-llm-private-checkpoint.tar.gz.enc \
            -pass env:PRIVATE_ARCHIVE_KEY
          unset archive_key
          rm -f "$RUNNER_TEMP/pure-llm-private-checkpoint.tar.gz"

      - name: Upload the anonymous aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-llm-private-public-report
          path: artifacts/pure-llm-private-public-report.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload the encrypted diagnostic checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-llm-private-encrypted-diagnostics
          path: artifacts/pure-llm-private-checkpoint.tar.gz.enc
          if-no-files-found: warn
          retention-days: 1

      - name: Stop the preview branch backend and scrub plaintext
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/private-evaluation-backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/private-evaluation-backend.pid")" 2>/dev/null || true
          fi
          rm -rf \
            "$RUNNER_TEMP/private-dataset.txt" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint" \
            "$RUNNER_TEMP/private-evaluation-backend.log" \
            "$RUNNER_TEMP/private-evaluation-backend.pid"

      - name: Enforce evaluation completion
        if: steps.evaluation.outputs.exit_code != '0'
        run: exit "${{ steps.evaluation.outputs.exit_code }}"
