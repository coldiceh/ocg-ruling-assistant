name: Validate preview changes

on:
  push:
    branches:
      - "codex/**"
    tags:
      - "private-eval-pilot-*"
      - "private-eval-targeted-*"
      - "private-eval-full-*"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      evaluation_limit:
        description: Run the one-case pilot first; select 32 only after the pilot succeeds
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "32"
      evaluation_case_ids:
        description: Optional comma-separated anonymous case IDs (for example case-028,case-032)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: validate-preview-${{ github.event.pull_request.number || github.ref }}
  # A paid request may already have reached the relay when cancellation arrives.
  # Queue another run instead of creating an ambiguous, possibly charged retry.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and data checks
        run: pnpm run check

      - name: Run the complete test suite serially
        shell: bash
        run: |
          set +e
          node --test --test-force-exit --test-concurrency=1 \
            --test-isolation=none --test-reporter=spec \
            2>&1 | tee "$RUNNER_TEMP/complete-tests.log"
          test_status="${PIPESTATUS[0]}"
          set -e
          if [ "$test_status" -ne 0 ]; then
            # Public tests contain no private evaluation text. Mirror a bounded
            # failure-name summary into a check annotation so a public CI
            # failure can be diagnosed through the checks API without a GitHub
            # web login. Avoid spending the annotation limit on passed tests.
            failure_tail="$(grep -E '^(test at |✖ |  AssertionError|    actual:|    expected:)' \
              "$RUNNER_TEMP/complete-tests.log" | tail -c 12000 || true)"
            if [ -z "$failure_tail" ]; then
              failure_tail="$(tail -c 12000 "$RUNNER_TEMP/complete-tests.log")"
            fi
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            echo "::error title=Complete serial test suite failed::$failure_tail"
            exit "$test_status"
          fi

  private-evaluation:
    if: >-
      github.actor == github.repository_owner
      && github.triggering_actor == github.repository_owner
      && ((github.event_name == 'pull_request'
          && github.event.action == 'labeled'
          && github.event.pull_request.user.login == github.repository_owner
          && (github.event.label.name == 'private-pure-llm-evaluation-pilot'
            || github.event.label.name == 'private-pure-llm-retrieval-pilot'
            || github.event.label.name == 'private-pure-llm-evaluation')
          && github.event.pull_request.head.repo.full_name == github.repository)
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push'
          && github.ref_type == 'tag'
          && (startsWith(github.ref_name, 'private-eval-pilot-')
            || startsWith(github.ref_name, 'private-eval-targeted-')
            || startsWith(github.ref_name, 'private-eval-full-'))))
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      archive_created: ${{ steps.private_archive.outputs.created }}
      selected_case_count: ${{ steps.evaluation.outputs.selected_case_count }}
    # Keep a bounded job-level guard even though each request now mirrors the
    # Production function window. Healthy runs return as soon as they finish.
    timeout-minutes: 75
    concurrency:
      # All paid private evaluations are globally serial for this repository,
      # including runs dispatched from different branches or pull requests.
      group: private-pure-llm-evaluation-${{ github.repository }}
      cancel-in-progress: false
    env:
      RELAY_BASE_URL: https://api.986310.xyz/v1
      PUBLIC_RULING_MODEL_PROFILE: relay-gpt-5.6-sol-low
      RELAY_RULE_MODEL: gpt-5.6-sol
      RAG_RULE_MODEL_REASONING_EFFORT: low
      # Match the deployed public answer path. The old evaluation-only 8192
      # token / 60-second limits could reject a candidate that Production would
      # still be generating, so they were not a valid accuracy gate.
      RELAY_MAX_COMPLETION_TOKENS: "32000"
      RELAY_STREAM_TIMEOUT_MS: "270000"
      API_CHATGPT_DAILY_BUDGET_USD: "10"
      API_DAILY_BUDGET_CNY: "10"
      QUERY_AUDIT_ENABLED: "false"
      HOST: 127.0.0.1
      PORT: "18787"
      # This label exercises the complete retrieval and prompt-building path
      # with the built-in dry-run response. It must never receive a paid key.
      RETRIEVAL_ONLY_PILOT: ${{ github.event_name == 'pull_request' && github.event.label.name == 'private-pure-llm-retrieval-pilot' && 'true' || 'false' }}
      TAG_TRIGGERED_PRIVATE_EVALUATION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'true' || 'false' }}
      # The pilot label is one case; the full label is 32. workflow_dispatch is
      # also available once this workflow reaches the repository default branch.
      # Owner-pushed evaluation tags provide a Git-only trigger when the GitHub
      # web/API session is unavailable; pilot and full tags can target the same
      # immutable preview commit.
      EVALUATION_LIMIT: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_limit
          || (github.event_name == 'push' && startsWith(github.ref_name, 'private-eval-targeted-') && '32')
          || (github.event_name == 'push' && startsWith(github.ref_name, 'private-eval-full-') && '32')
          || (github.event.label.name == 'private-pure-llm-evaluation' && '32')
          || '1' }}
      EVALUATION_CASE_IDS: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_case_ids
          || (github.event_name == 'push' && startsWith(github.ref_name, 'private-eval-targeted-')
            && 'case-004,case-007,case-018,case-019,case-023,case-027,case-028,case-032')
          || '' }}
    steps:
      - name: Checkout the exact preview commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify the owner evaluation tag targets the trusted preview branch
        if: env.TAG_TRIGGERED_PRIVATE_EVALUATION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            refs/heads/codex/pure-llm-preview-v1:refs/remotes/origin/codex/pure-llm-preview-v1
          test "$(git rev-parse "$GITHUB_SHA^{commit}")" = \
            "$(git rev-parse refs/remotes/origin/codex/pure-llm-preview-v1)"

      - name: Preflight private archive encryption
        if: env.RETRIEVAL_ONLY_PILOT != 'true'
        shell: bash
        env:
          PRIVATE_ARCHIVE_KEY: ${{ secrets.PURE_LLM_EVALUATION_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          if [ "$TAG_TRIGGERED_PRIVATE_EVALUATION" = "true" ]; then
            test -s .github/private-evaluation-recipient.pem
            recipient_sha256="$(sha256sum .github/private-evaluation-recipient.pem | awk '{print $1}')"
            test "$recipient_sha256" = "749295ac7c83b5c765722975c4a6985dedcfcd9dc02eeab3e01dd648ff8a4b3e"
            openssl pkey -pubin -in .github/private-evaluation-recipient.pem -noout
            exit 0
          fi
          if [ "${#PRIVATE_ARCHIVE_KEY}" -lt 32 ]; then
            echo "The private evaluation archive key is missing or too short" >&2
            exit 1
          fi

      - name: Materialize the private dataset without logging it
        shell: bash
        env:
          PRIVATE_DATASET_BASE64: ${{ secrets.PURE_LLM_EVALUATION_DATASET_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_DATASET_BASE64" ]; then
            echo "The private evaluation dataset is not configured" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$PRIVATE_DATASET_BASE64" | base64 --decode > "$RUNNER_TEMP/private-dataset.txt"
          test -s "$RUNNER_TEMP/private-dataset.txt"

      - name: Start the retrieval-only preview backend without a paid key
        if: env.RETRIEVAL_ONLY_PILOT == 'true'
        shell: bash
        env:
          RAG_DRY_RUN: "true"
          MODEL_PROVIDER: mock
          PRIVATE_EVALUATION_DIAGNOSTICS: "true"
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${RELAY_API_KEY:-}" ]; then
            echo "Retrieval-only pilot unexpectedly received a paid provider key" >&2
            exit 1
          fi
          node backend/server.mjs > "$RUNNER_TEMP/private-evaluation-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/private-evaluation-backend.pid"
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error "http://127.0.0.1:$PORT/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Preview backend did not become healthy" >&2
          exit 1

      - name: Start the paid preview branch backend
        if: env.RETRIEVAL_ONLY_PILOT != 'true'
        shell: bash
        env:
          RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
          PRIVATE_EVALUATION_MODE: "true"
          PRIVATE_EVALUATION_DIAGNOSTICS: "true"
          PRIVATE_EVALUATION_BUDGET_USD: "40"
          PRIVATE_EVALUATION_AUXILIARY_BUDGET_CNY: "10"
          PRIVATE_EVALUATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$RELAY_API_KEY" ]; then
            echo "The Relay key for paid private evaluation must be configured" >&2
            exit 1
          fi
          node backend/server.mjs > "$RUNNER_TEMP/private-evaluation-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/private-evaluation-backend.pid"
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error "http://127.0.0.1:$PORT/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Preview backend did not become healthy" >&2
          exit 1

      - name: Generate private candidates serially without a model judge
        id: evaluation
        shell: bash
        run: |
          set +e
          umask 077
          mkdir -p artifacts
          case_count_args=()
          include_case_args=()
          if [ "$EVALUATION_LIMIT" = "32" ]; then
            case_count_args+=(--require-case-count 32)
          fi
          if [ -n "${EVALUATION_CASE_IDS//[[:space:]]/}" ]; then
            IFS=',' read -ra requested_case_ids <<< "$EVALUATION_CASE_IDS"
            for raw_case_id in "${requested_case_ids[@]}"; do
              case_id="${raw_case_id//[[:space:]]/}"
              if [ -n "$case_id" ]; then
                include_case_args+=(--include-case "$case_id")
              fi
            done
          fi
          node scripts/evaluate-pure-llm-preview.mjs \
            --dataset "$RUNNER_TEMP/private-dataset.txt" \
            --checkpoint-dir "$RUNNER_TEMP/pure-llm-private-checkpoint" \
            --report artifacts/pure-llm-private-public-report.json \
            --base-url "http://127.0.0.1:$PORT" \
            --generate-only \
            "${include_case_args[@]}" \
            --limit "$EVALUATION_LIMIT" \
            "${case_count_args[@]}" \
            --generation-timeout-ms 300000
          status=$?
          if [ -s artifacts/pure-llm-private-public-report.json ]; then
            selected_case_count="$(node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("artifacts/pure-llm-private-public-report.json", "utf8"));
          const selectedCount = Number(report.summary?.total);
          if (!Number.isSafeInteger(selectedCount) || selectedCount < 0) {
            throw new Error("Private evaluation report contains an invalid selected-case count");
          }
          process.stdout.write(String(selectedCount));
          NODE
            )"
            echo "SELECTED_EVALUATION_COUNT=$selected_case_count" >> "$GITHUB_ENV"
            echo "selected_case_count=$selected_case_count" >> "$GITHUB_OUTPUT"
            generation_failed="$(node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("artifacts/pure-llm-private-public-report.json", "utf8"));
          const failed = Number(report.summary?.generationFailed);
          if (!Number.isSafeInteger(failed) || failed < 0) {
            throw new Error("Private evaluation report contains an invalid generation-failure count");
          }
          process.stdout.write(String(failed));
          NODE
            )"
            echo "generation_failed=$generation_failed" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print anonymous pilot stage diagnostics
        if: always() && env.EVALUATION_LIMIT == '1'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { projectPrivateEvaluationStageLog } from "./scripts/lib/private-evaluation-stage-log.mjs";
          let source = "";
          try {
            source = await readFile(`${process.env.RUNNER_TEMP}/private-evaluation-backend.log`, "utf8");
          } catch {
            console.log(JSON.stringify({ kind: "private_evaluation_stage_summary", eventCount: 0 }));
            process.exit(0);
          }

          const events = projectPrivateEvaluationStageLog(source);
          console.log(JSON.stringify({
            kind: "private_evaluation_stage_summary",
            eventCount: events.length,
          }));
          for (const event of events) console.log(JSON.stringify(event));
          NODE

      - name: Verify the retrieval-only pilot reached prompt construction without Relay dispatch
        if: always() && env.RETRIEVAL_ONLY_PILOT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const log = await readFile(`${process.env.RUNNER_TEMP}/private-evaluation-backend.log`, "utf8");
          const events = log.split(/\r?\n/u).flatMap((line) => {
            const jsonStart = line.indexOf("{");
            if (jsonStart < 0) return [];
            try {
              const value = JSON.parse(line.slice(jsonStart));
              return value && typeof value === "object" ? [value] : [];
            } catch {
              return [];
            }
          });
          if (events.some((event) => event.event === "relay_dispatch")) {
            throw new Error("Retrieval-only pilot crossed the paid Relay dispatch boundary");
          }
          const byTrace = new Map();
          for (const event of events) {
            if (event.kind !== "private_evaluation_stage" || !event.traceId) continue;
            const trace = byTrace.get(event.traceId) || [];
            trace.push(event);
            byTrace.set(event.traceId, trace);
          }
          const completedOneTrace = [...byTrace.values()].some((trace) => {
            const ended = new Set(trace
              .filter((event) => event.event === "end")
              .map((event) => event.stage));
            return ended.has("retrieval")
              && ended.has("prompt_build")
              && ended.has("total")
              && !trace.some((event) => event.event === "fail");
          });
          if (!completedOneTrace) {
            throw new Error("No single retrieval-only trace completed retrieval, prompt construction and total");
          }
          NODE

      - name: Verify the report contains no private text
        id: public_report_privacy
        if: always()
        shell: bash
        run: |
          test -s artifacts/pure-llm-private-public-report.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { parseDatasetText } from "./scripts/evaluate-pure-llm-preview.mjs";
          const dataset = parseDatasetText(await readFile(`${process.env.RUNNER_TEMP}/private-dataset.txt`, "utf8"));
          const reportText = await readFile("artifacts/pure-llm-private-public-report.json", "utf8");
          const report = JSON.parse(reportText);
          for (const item of dataset.cases) {
            if (reportText.includes(item.question) || reportText.includes(item.referenceAnswer)) {
              throw new Error("Public report contains private evaluation text");
            }
          }
          const forbiddenKeys = new Set([
            "cases", "judge", "judgments", "verdict", "reviewed", "correct",
            "partiallyCorrect", "incorrect", "judgeFailed", "reviewCoverage",
            "reviewedAccuracy", "strictOverallAccuracy", "judgment",
          ]);
          const visit = (value) => {
            if (!value || typeof value !== "object") return;
            for (const [key, item] of Object.entries(value)) {
              if (forbiddenKeys.has(key)) throw new Error(`Public generation report contains forbidden field: ${key}`);
              visit(item);
            }
          };
          visit(report);
          const assertExactKeys = (value, allowed, label) => {
            const actual = Object.keys(value || {}).sort();
            const expected = [...allowed].sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`${label} fields are not the approved anonymous aggregate schema`);
            }
          };
          assertExactKeys(report,
            ["schemaVersion", "generatedAt", "mode", "summary"], "report");
          assertExactKeys(report.summary,
            ["total", "generated", "generationFailed", "latencyMs", "estimatedCostUsd"], "summary");
          assertExactKeys(report.summary.latencyMs, ["generation"], "latency summary");
          assertExactKeys(report.summary.latencyMs.generation,
            ["count", "average", "p50", "p95", "min", "max"], "generation latency summary");
          assertExactKeys(report.summary.estimatedCostUsd,
            ["pricingBasis", "generation", "total", "generationCoverage"], "cost summary");
          if (report.mode !== "generate_only") {
            throw new Error("Public report is not generation-only");
          }
          const selectedCount = Number(process.env.SELECTED_EVALUATION_COUNT);
          if (!Number.isSafeInteger(selectedCount) || selectedCount < 0
            || report.summary?.total !== selectedCount) {
            throw new Error("Public report selected-case count does not match the actual selection");
          }
          const retrievalOnly = process.env.RETRIEVAL_ONLY_PILOT === "true";
          const generated = Number(report.summary?.generated);
          const generationFailed = Number(report.summary?.generationFailed);
          if (!Number.isSafeInteger(generated) || generated < 0
            || !Number.isSafeInteger(generationFailed) || generationFailed < 0
            || generated + generationFailed !== selectedCount) {
            throw new Error("Private evaluation completion counts do not match the selected mode");
          }
          if (retrievalOnly && (generated !== 0 || generationFailed !== selectedCount)) {
            throw new Error("Retrieval-only completion counts do not match the expected safe failure mode");
          }
          NODE

      - name: Verify retrieval-only failures contain no candidate text
        if: always() && env.RETRIEVAL_ONLY_PILOT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          const directory = `${process.env.RUNNER_TEMP}/pure-llm-private-checkpoint/generations`;
          const files = (await readdir(directory)).filter((name) => name.endsWith(".json"));
          if (files.length !== Number(process.env.SELECTED_EVALUATION_COUNT)) {
            throw new Error("Retrieval-only checkpoint count does not match the actual selection");
          }
          for (const file of files) {
            const record = JSON.parse(await readFile(`${directory}/${file}`, "utf8"));
            if (record.status !== "generation_failed"
              || record.failureCode !== "preview_dry_run_response"
              || record.candidateResponseText !== "") {
              throw new Error("Retrieval-only checkpoint was not a redacted expected dry-run failure");
            }
          }
          NODE

      - name: Encrypt the private manual-review checkpoint
        id: private_archive
        if: always() && env.RETRIEVAL_ONLY_PILOT != 'true'
        shell: bash
        env:
          PRIVATE_ARCHIVE_KEY: ${{ secrets.PURE_LLM_EVALUATION_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          echo "created=false" >> "$GITHUB_OUTPUT"
          checkpoint="$RUNNER_TEMP/pure-llm-private-checkpoint"
          if [ ! -d "$checkpoint" ]; then
            exit 0
          fi
          if [ "${{ steps.evaluation.outputs.exit_code }}" = "0" ]; then
            test -s "$checkpoint/manual-review.json"
          fi
          mkdir -p artifacts
          plaintext_archive="$RUNNER_TEMP/pure-llm-private-checkpoint.tar.gz"
          verification_archive="$RUNNER_TEMP/pure-llm-private-checkpoint.verify.tar.gz"
          random_password_file="$RUNNER_TEMP/pure-llm-private-checkpoint.password"
          key_envelope_file="$RUNNER_TEMP/pure-llm-private-checkpoint.key-envelope"
          encrypted_archive="artifacts/pure-llm-private-checkpoint.tar.gz.enc"
          wrapped_key_envelope="artifacts/pure-llm-private-checkpoint.key-envelope.rsa-oaep"
          cleanup_plaintext_archives() {
            rm -f -- \
              "$plaintext_archive" \
              "$verification_archive" \
              "$random_password_file" \
              "$key_envelope_file"
          }
          trap cleanup_plaintext_archives EXIT
          tar_args=(pure-llm-private-checkpoint)
          # Provider diagnostics may contain user material. They are retained
          # only inside the encrypted owner-review archive.
          if [ -s "$RUNNER_TEMP/private-evaluation-backend.log" ]; then
            tar_args+=(private-evaluation-backend.log)
          fi
          tar -C "$RUNNER_TEMP" -czf "$plaintext_archive" "${tar_args[@]}"
          if [ "$TAG_TRIGGERED_PRIVATE_EVALUATION" = "true" ]; then
            openssl rand -hex 32 > "$random_password_file"
            chmod 600 "$random_password_file"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
              -in "$plaintext_archive" \
              -out "$encrypted_archive" \
              -pass file:"$random_password_file"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
              -in "$encrypted_archive" \
              -out "$verification_archive" \
              -pass file:"$random_password_file"
            tar -tzf "$verification_archive" > /dev/null
            cipher_sha256="$(sha256sum "$encrypted_archive" | awk '{print $1}')"
            {
              printf 'schema_version=1\n'
              printf 'password=%s\n' "$(tr -d '\r\n' < "$random_password_file")"
              printf 'cipher_sha256=%s\n' "$cipher_sha256"
              printf 'source_sha=%s\n' "$GITHUB_SHA"
            } > "$key_envelope_file"
            chmod 600 "$key_envelope_file"
            openssl pkeyutl -encrypt \
              -pubin \
              -inkey .github/private-evaluation-recipient.pem \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256 \
              -in "$key_envelope_file" \
              -out "$wrapped_key_envelope"
            chmod 600 "$wrapped_key_envelope"
            test -s "$wrapped_key_envelope"
          else
            if [ "${#PRIVATE_ARCHIVE_KEY}" -lt 32 ]; then
              echo "The private evaluation archive key is missing or too short" >&2
              exit 1
            fi
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
              -in "$plaintext_archive" \
              -out "$encrypted_archive" \
              -pass env:PRIVATE_ARCHIVE_KEY
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
              -in "$encrypted_archive" \
              -out "$verification_archive" \
              -pass env:PRIVATE_ARCHIVE_KEY
            tar -tzf "$verification_archive" > /dev/null
          fi
          chmod 600 "$encrypted_archive"
          test -s "$encrypted_archive"
          cleanup_plaintext_archives
          trap - EXIT
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload the anonymous aggregate report
        if: always() && steps.public_report_privacy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pure-llm-private-public-report
          path: artifacts/pure-llm-private-public-report.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload the encrypted private manual-review archive
        if: >-
          always()
          && env.TAG_TRIGGERED_PRIVATE_EVALUATION != 'true'
          && steps.private_archive.outcome == 'success'
          && steps.private_archive.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pure-llm-private-manual-review-encrypted
          path: artifacts/pure-llm-private-checkpoint.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the RSA-wrapped private manual-review archive
        if: >-
          always()
          && env.TAG_TRIGGERED_PRIVATE_EVALUATION == 'true'
          && steps.private_archive.outcome == 'success'
          && steps.private_archive.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pure-llm-private-manual-review-encrypted
          path: |
            artifacts/pure-llm-private-checkpoint.tar.gz.enc
            artifacts/pure-llm-private-checkpoint.key-envelope.rsa-oaep
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stop the preview branch backend and scrub plaintext
        if: always()
        shell: bash
        run: |
          set +e
          umask 077
          cleanup_status=0
          if [ -s "$RUNNER_TEMP/private-evaluation-backend.pid" ]; then
            backend_pid="$(cat "$RUNNER_TEMP/private-evaluation-backend.pid")"
            if [[ "$backend_pid" =~ ^[1-9][0-9]*$ ]]; then
              kill "$backend_pid" 2>/dev/null || true
              for _ in $(seq 1 50); do
                if ! kill -0 "$backend_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
              if kill -0 "$backend_pid" 2>/dev/null; then
                kill -KILL "$backend_pid" 2>/dev/null || true
                for _ in $(seq 1 20); do
                  if ! kill -0 "$backend_pid" 2>/dev/null; then
                    break
                  fi
                  sleep 0.1
                done
              fi
              if kill -0 "$backend_pid" 2>/dev/null; then
                echo "Preview backend process $backend_pid is still running after SIGKILL" >&2
                cleanup_status=1
              fi
            else
              echo "Preview backend PID file is invalid" >&2
              cleanup_status=1
            fi
          fi
          rm -rf \
            "$RUNNER_TEMP/private-dataset.txt" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint" \
            "$RUNNER_TEMP/private-evaluation-backend.log" \
            "$RUNNER_TEMP/private-evaluation-backend.pid" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint.tar.gz" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint.verify.tar.gz"
          rm -f -- \
            "$RUNNER_TEMP/pure-llm-private-checkpoint.password" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint.key-envelope" \
            artifacts/pure-llm-private-checkpoint.tar.gz.enc \
            artifacts/pure-llm-private-checkpoint.key-envelope.rsa-oaep
          for private_path in \
            "$RUNNER_TEMP/private-dataset.txt" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint" \
            "$RUNNER_TEMP/private-evaluation-backend.log" \
            "$RUNNER_TEMP/private-evaluation-backend.pid" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint.tar.gz" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint.verify.tar.gz" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint.password" \
            "$RUNNER_TEMP/pure-llm-private-checkpoint.key-envelope" \
            "artifacts/pure-llm-private-checkpoint.tar.gz.enc" \
            "artifacts/pure-llm-private-checkpoint.key-envelope.rsa-oaep"; do
            if [ -e "$private_path" ]; then
              echo "Failed to scrub private evaluation plaintext" >&2
              cleanup_status=1
            fi
          done
          exit "$cleanup_status"

      - name: Enforce evaluator process completion
        if: steps.evaluation.outputs.exit_code != '0'
        run: exit "${{ steps.evaluation.outputs.exit_code }}"

      - name: Enforce complete paid generation after private archive and cleanup
        if: >-
          env.RETRIEVAL_ONLY_PILOT != 'true'
          && steps.evaluation.outputs.exit_code == '0'
          && steps.evaluation.outputs.generation_failed != '0'
        run: |
          echo "${{ steps.evaluation.outputs.generation_failed }} paid evaluation case(s) failed to generate; the encrypted review archive was preserved." >&2
          exit 1

  publish-encrypted-private-evaluation:
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref_type == 'tag'
      && github.actor == github.repository_owner
      && github.triggering_actor == github.repository_owner
      && needs.private-evaluation.outputs.archive_created == 'true'
    needs: private-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EVALUATION_LIMIT: >-
        ${{ (startsWith(github.ref_name, 'private-eval-targeted-') || startsWith(github.ref_name, 'private-eval-full-')) && '32' || '1' }}
      SELECTED_EVALUATION_COUNT: ${{ needs.private-evaluation.outputs.selected_case_count }}
    steps:
      - name: Checkout the encrypted-results branch only
        uses: actions/checkout@v6
        with:
          ref: private-evaluation-results
          path: private-evaluation-results

      - name: Download the encrypted owner-review archive
        uses: actions/download-artifact@v4
        with:
          name: pure-llm-private-manual-review-encrypted
          path: ${{ runner.temp }}/private-evaluation-encrypted

      - name: Verify and publish the encrypted owner-review bundle
        shell: bash
        run: |
          set -euo pipefail
          encrypted_dir="$RUNNER_TEMP/private-evaluation-encrypted"
          ciphertext="$encrypted_dir/pure-llm-private-checkpoint.tar.gz.enc"
          wrapped_envelope="$encrypted_dir/pure-llm-private-checkpoint.key-envelope.rsa-oaep"
          test -s "$ciphertext"
          test -s "$wrapped_envelope"
          test "$(find "$encrypted_dir" -type f | wc -l)" -eq 2

          results_repo="private-evaluation-results"
          run_relative="runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="$results_repo/$run_relative"
          test ! -e "$run_dir"
          mkdir -p "$run_dir"
          cp "$ciphertext" "$run_dir/"
          cp "$wrapped_envelope" "$run_dir/"
          cipher_sha256="$(sha256sum "$ciphertext" | awk '{print $1}')"
          envelope_sha256="$(sha256sum "$wrapped_envelope" | awk '{print $1}')"
          printf '%s\n' \
            'schema_version=1' \
            'archive_cipher=aes-256-cbc-pbkdf2-sha256-iter200000' \
            'key_envelope=rsa-oaep-sha256-mgf1-sha256' \
            "source_sha=$GITHUB_SHA" \
            "requested_evaluation_limit=$EVALUATION_LIMIT" \
            "selected_evaluation_count=$SELECTED_EVALUATION_COUNT" \
            "run_id=$GITHUB_RUN_ID" \
            "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "cipher_sha256=$cipher_sha256" \
            "key_envelope_sha256=$envelope_sha256" \
            > "$run_dir/metadata.txt"

          git -C "$results_repo" config user.name github-actions[bot]
          git -C "$results_repo" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$results_repo" add -- \
            "$run_relative/pure-llm-private-checkpoint.tar.gz.enc" \
            "$run_relative/pure-llm-private-checkpoint.key-envelope.rsa-oaep" \
            "$run_relative/metadata.txt"
          git -C "$results_repo" diff --cached --check
          git -C "$results_repo" commit -m "Store encrypted private evaluation ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C "$results_repo" push origin HEAD:refs/heads/private-evaluation-results
