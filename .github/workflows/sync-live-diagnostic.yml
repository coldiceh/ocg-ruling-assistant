name: Read live sync spending and cached vector count
on:
  push:
    branches: [fix/sync-429-recovery-20260921]
    paths: [.github/workflows/sync-live-diagnostic.yml]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read only the existing budget and namespace inventory
        env:
          REDIS_URL: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_URL }}
          REDIS_TOKEN: ${{ secrets.UPSTASH_BUDGET_KV_REST_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const command=async args=>{assert.ok(['HGETALL','SCAN'].includes(args[0]));const r=await fetch(process.env.REDIS_URL,{method:'POST',headers:{authorization:'Bearer '+process.env.REDIS_TOKEN,'content-type':'application/json'},body:JSON.stringify(args),signal:AbortSignal.timeout(30000)});const b=await r.json();if(!r.ok||b.error)throw Error('read_only_diagnostic_failed');return b.result;};
          const raw=await command(['HGETALL','evidence-sync-batch:v1:{ocg-daily-sync-20260920}:64198715d3c7819a53a7128bba8998eac5915ab33ee82874148fefec16591d1c']);const s=Array.isArray(raw)?Object.fromEntries(Array.from({length:raw.length/2},(_,i)=>[raw[2*i],raw[2*i+1]])):raw;
          let cursor='0',pages=0;const keys=new Set();do{const v=await command(['SCAN',cursor,'MATCH','evidence-preprocess:dense:*:ocg-daily-sync-20260920:result','COUNT','1000']);cursor=String(v[0]);v[1].forEach(k=>keys.add(k));if(++pages>1000)throw Error('scan_limit');}while(cursor!=='0');
          const result={checkedAt:new Date().toISOString(),knownCumulativeUsd:Number(s.spent)/1e9,newSince429ReconciliationUsd:(Number(s.spent)-690985757)/1e9,pendingReservationsUsd:Number(s.held)/1e9,remainingUsd:(Number(s.limit)-Number(s.spent)-Number(s.held))/1e9,settledPaymentTickets:Object.keys(s).filter(k=>k.startsWith('s:')).length,pendingPaymentTickets:Object.keys(s).filter(k=>k.startsWith('r:')).length,cachedDenseResults:keys.size,modelCallsInThisDiagnostic:0,stateWritesInThisDiagnostic:0,priceBasis:'configured_rates_not_supplier_invoice'};
          console.log('LIVE_SYNC_DIAGNOSTIC '+JSON.stringify(result));fs.writeFileSync(process.env.RUNNER_TEMP+'/live-sync.json',JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: live-sync-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/live-sync.json
          retention-days: 3
