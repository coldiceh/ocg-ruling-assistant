name: Validate CPU-only sync continuation
on:
  push:
    branches: [fix/sync-durable-increments-20260921]
    paths: [.github/workflows/sync-durable-validate.yml, .sync-durability.patch.gz.b64]
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply byte-verified isolated patch
        run: |
          mkdir -p "$RUNNER_TEMP/continuation-validation"
          cp .sync-durability.patch.gz.b64 "$RUNNER_TEMP/continuation-validation/transfer.b64"
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          b=pathlib.Path('.sync-durability.patch.gz.b64').read_text()
          patch=gzip.decompress(base64.b64decode(b))
          assert hashlib.sha256(patch).hexdigest()=='eac743ac23eb70b886f27680d49bb9b67e4dedcbb7c4c27fc6810c90351bc4bc'
          pathlib.Path('/tmp/sync-durability.patch').write_bytes(patch)
          PY
          test -z "$(git diff --name-only 848ce8d4ed2506982f97665a8012a2c110929fd2 HEAD -- backend scripts tests config .github/workflows/sync-data.yml)"
          git apply --check /tmp/sync-durability.patch
          git apply /tmp/sync-durability.patch
      - name: Test complete synchronization and CPU continuation gates without providers
        run: |
          node --test --test-concurrency=1 tests/sync-cpu-continuation.test.mjs tests/cloud-sync-resume.test.mjs tests/cloud-evidence-incremental-sync.test.mjs tests/deployment-workflows.test.mjs tests/sync-snapshot-publication.test.mjs tests/sync-official-reference.test.mjs tests/evidence-navigation-output-recovery.test.mjs tests/evidence-generation-transport.test.mjs tests/evidence-preprocess-navigation.test.mjs tests/evidence-preprocess-cloud.test.mjs tests/sync-bounded-evidence-assets.test.mjs tests/bai-evidence-generation-profile.test.mjs tests/evidence-preprocess-run-cost.test.mjs tests/evidence-sync-budget-speed.test.mjs | tee "$RUNNER_TEMP/continuation-validation/tests.txt"
          python -m unittest discover -s tests -p 'test_cloud_embedding*.py'
          node --check scripts/restore-sync-checkpoint.mjs
          python -m py_compile scripts/embed-missing-cloud-evidence.py scripts/cloud_embedding_progress.py
          git diff --check
      - name: Upload only the six validated source blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          const paths=['.github/workflows/sync-data.yml','scripts/cloud_embedding_progress.py','scripts/embed-missing-cloud-evidence.py','scripts/restore-sync-checkpoint.mjs','tests/sync-cpu-continuation.test.mjs','tests/test_cloud_embedding_progress.py'];
          const elements=[];
          for(const path of paths){const content=await fs.readFile(path,'utf8');const bytes=Buffer.from(content);const expected=crypto.createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`),bytes])).digest('hex');const r=await fetch('https://api.github.com/repos/coldiceh/ocg-ruling-assistant/git/blobs',{method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'content-type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({content,encoding:'utf-8'})});if(!r.ok)throw Error(`blob_upload_${r.status}`);const body=await r.json();if(body.sha!==expected)throw Error('blob_mismatch');elements.push({path,mode:'100644',type:'blob',sha:body.sha});}
          await fs.writeFile(process.env.RUNNER_TEMP+'/continuation-validation/tested-blobs.json',JSON.stringify({base:'848ce8d4ed2506982f97665a8012a2c110929fd2',elements},null,2));
          console.log('TESTED_BLOBS '+JSON.stringify(elements));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-continuation-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/continuation-validation/*
          if-no-files-found: error
          retention-days: 3
